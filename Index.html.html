const SKILLS = [
  /* English */
  { id: "commas", sec: "E", name: "Commas and extra information",
    rule: "Nonessential information (you could delete it and keep the core meaning) gets a comma on both sides. Essential information gets none. Never put a single comma between a subject and its verb, or between a noun and the phrase that defines it.",
    ex: [[0, "My sister who lives in Denver is a nurse. (if you have one sister)"], [1, "My sister, who lives in Denver, is a nurse."], [1, "Students who finish early may leave. (essential: which students)"]] },
  { id: "boundaries", sec: "E", name: "Sentence boundaries",
    rule: "Two complete sentences need a period, a semicolon, or a comma plus FANBOYS (for, and, nor, but, or, yet, so). A comma alone is a comma splice. However, therefore, and moreover are not FANBOYS. A fragment with no subject or main verb attaches to its neighbor with a comma.",
    ex: [[0, "The bus was late, we missed the opening."], [1, "The bus was late; we missed the opening."], [1, "The bus was late, so we missed the opening."]] },
  { id: "punct", sec: "E", name: "Colons, dashes, and apostrophes",
    rule: "A colon needs a complete sentence before it, then a list or explanation. Never use one after such as, including, or a verb. An interrupter closes with the same mark that opened it. It's means it is; its is possessive. Plural possessives take the apostrophe after the s.",
    ex: [[0, "We need: flour, eggs, and milk."], [1, "We need three things: flour, eggs, and milk."], [1, "The dog wagged its tail. It's raining."]] },
  { id: "agreement", sec: "E", name: "Subject–verb and pronoun agreement",
    rule: "Cross out prepositional phrases to find the real subject. Each, every, either, and neither are singular. Group nouns (team, council, company) are singular and take it. With neither…nor, the verb matches the closer subject. A pronoun must point to one clear noun.",
    ex: [[0, "The box of books are heavy."], [1, "The box of books is heavy."], [1, "The team lost its first game."]] },
  { id: "usage", sec: "E", name: "Tense, pronoun case, idioms, comparisons",
    rule: "Match tense to the time clues and the verbs around it; by the time + past event takes had + verb. To test I or me, drop the other person. Who works like he, whom like him. Use fewer for things you can count, less for amounts. Compare like with like.",
    ex: [[0, "between you and I"], [1, "between you and me"], [0, "less mistakes"], [1, "fewer mistakes"]] },
  { id: "modifiers", sec: "E", name: "Modifiers and parallelism",
    rule: "An opening descriptive phrase describes whatever comes right after the comma. Keep modifiers next to what they describe. Items in a list or a comparison share the same form.",
    ex: [[0, "Running for the bus, my phone fell."], [1, "Running for the bus, I dropped my phone."], [1, "She likes hiking, biking, and swimming."]] },
  { id: "concision", sec: "E", name: "Concision and redundancy",
    rule: "If the shortest choice is grammatical and keeps the meaning, it is usually right. Cut anything that repeats an idea already in the sentence.",
    ex: [[0, "the final end result"], [1, "the result"], [0, "due to the fact that"], [1, "because"]] },
  { id: "transitions", sec: "E", name: "Transitions and logic",
    rule: "Name the relationship between the two ideas first (contrast, cause and effect, example, addition, sequence), then pick the word that signals it. Contrast: however, still, yet. Cause: therefore, as a result. Example: for instance.",
    ex: [[0, "It rained. Therefore, the game went on."], [1, "It rained. Still, the game went on."]] },
  { id: "rhetoric", sec: "E", name: "Purpose, add or delete, word choice",
    rule: "For which-choice-best questions, reread the stated goal and match it exactly. Keep an added sentence only if it serves the paragraph's focus. Match the passage's tone with precise, formal words. Decide yes or no first, then the reason.",
    ex: [[0, "The results were really super good."], [1, "The results were remarkably consistent."]] },

  /* Math */
  { id: "percent", sec: "M", name: "Percents, ratios, and rates",
    rule: "Percent change = (new − old) ÷ old. Apply back-to-back percent changes one at a time. For a ratio a : b, add the parts to get the total number of parts." },
  { id: "linear", sec: "M", name: "Lines, inequalities, and systems",
    rule: "Slope = rise ÷ run; y = mx + b. Parallel lines share a slope; perpendicular slopes are negative reciprocals. Solve systems by adding or substituting. |x| < a means −a < x < a." },
  { id: "quadratic", sec: "M", name: "Quadratics and polynomials",
    rule: "Factor, or use x = (−b ± √(b² − 4ac)) ÷ 2a. Vertex form a(x − h)² + k has vertex (h, k). Discriminant b² − 4ac: positive gives 2 real solutions, zero gives 1, negative gives none." },
  { id: "functions", sec: "M", name: "Functions and transformations",
    rule: "f(g(x)): work from the inside out. f(x + h) shifts left h; f(x) + k shifts up k. Exclude x-values that make a denominator zero. To find f⁻¹(a), solve f(x) = a." },
  { id: "exponents", sec: "M", name: "Exponents, radicals, and logs",
    rule: "Multiplying powers adds exponents; a power of a power multiplies them. x^(a/b) = (b-th root of x)^a. log_b x = y means b^y = x." },
  { id: "geometry", sec: "M", name: "Triangles, area, and volume",
    rule: "Triangle angles sum to 180°. a² + b² = c²; know 3-4-5 and 5-12-13. 45-45-90 sides: x, x, x√2. 30-60-90 sides: x, x√3, 2x. Similar figures scale every side by one factor." },
  { id: "circles", sec: "M", name: "Circles and coordinate geometry",
    rule: "(x − h)² + (y − k)² = r². Circumference 2πr, area πr², arc length (θ ÷ 360) × 2πr. Distance and midpoint formulas." },
  { id: "trig", sec: "M", name: "Trigonometry",
    rule: "SOH-CAH-TOA. sin²θ + cos²θ = 1. Know the 30°, 45°, and 60° values and which functions are positive in each quadrant. Period of sin(bx) is 2π ÷ b." },
  { id: "stats", sec: "M", name: "Probability and statistics",
    rule: "Mean = sum ÷ count; median = middle of the sorted list. And with independent events means multiply. Without replacement, the second fraction shrinks. Counting: multiply the options." },
  { id: "advanced", sec: "M", name: "Complex numbers, matrices, sequences",
    rule: "i² = −1, and powers of i repeat every 4. A 2×2 determinant is ad − bc. Arithmetic: aₙ = a₁ + (n − 1)d. Geometric: aₙ = a₁ × rⁿ⁻¹." },

  /* Reading question types */
  { id: "rmain", sec: "R", name: "Main idea and purpose", rule: "The right answer covers the whole passage, not one paragraph, and does not overreach." },
  { id: "rdetail", sec: "R", name: "Details and evidence", rule: "Go back and find the line. The right answer restates the text, often in different words." },
  { id: "rinfer", sec: "R", name: "Inferences", rule: "Pick what the text strongly supports: one short step beyond what is stated, never a leap." },
  { id: "rvocab", sec: "R", name: "Words in context", rule: "Swap each choice into the sentence and reread. The most common meaning of the word is often the trap." },
  { id: "rfunc", sec: "R", name: "Function of a part", rule: "Ask why this part is here: to introduce, contrast, give an example, or shift focus." },
  { id: "rview", sec: "R", name: "Author's view and perspectives", rule: "Look for tone words and how the author treats each side. Extreme attitudes are rarely right." }
];

const MODULES = [
  { id: "E1", sec: "E", skill: "commas" }, { id: "E2", sec: "E", skill: "boundaries" }, { id: "E3", sec: "E", skill: "punct" },
  { id: "E4", sec: "E", skill: "agreement" }, { id: "E5", sec: "E", skill: "usage" }, { id: "E6", sec: "E", skill: "modifiers" },
  { id: "E7", sec: "E", skill: "concision" }, { id: "E8", sec: "E", skill: "transitions" }, { id: "E9", sec: "E", skill: "rhetoric" },
  { id: "M1", sec: "M", skill: "percent" }, { id: "M2", sec: "M", skill: "linear" }, { id: "M3", sec: "M", skill: "quadratic" },
  { id: "M4", sec: "M", skill: "functions" }, { id: "M5", sec: "M", skill: "exponents" }, { id: "M6", sec: "M", skill: "geometry" },
  { id: "M7", sec: "M", skill: "circles" }, { id: "M8", sec: "M", skill: "trig" }, { id: "M9", sec: "M", skill: "stats" },
  { id: "M10", sec: "M", skill: "advanced" },
  { id: "R1", sec: "R", title: "The passage method", psg: "p2" },
  { id: "R2", sec: "R", title: "Evidence for every answer", psg: "p4" },
  { id: "R3", sec: "R", title: "Literary narrative", psg: "p1" },
  { id: "R4", sec: "R", title: "Humanities and personal essays", psg: "p3" },
  { id: "R5", sec: "R", title: "Timing and stamina", psg: null }
];
/* for short runways, keep only the highest-yield modules */
const PRIORITY = ["E1", "E2", "E3", "E4", "E7", "E8", "M2", "M3", "M4", "M6", "M8", "R1", "R2"];

const PASSAGES = {
  p1: { title: "The Tuner", type: "Literary narrative", text: [
    "My father tuned pianos for a living, and the summer I turned fifteen he decided I was old enough to carry his case. The case was heavier than it looked. Inside, wrapped in a gray flannel cloth, were his tuning hammer, a box of felt mutes, and a tuning fork he had owned since before I was born. He never let me touch the fork.",
    "Most of our appointments were the same: a church basement, a dance studio, a living room where a piano had become a shelf for family photographs. My father would play a single note, listen, adjust, and play it again. To me, the notes before and after sounded identical. I spent those hours reading in the car or counting ceiling tiles, wondering why anyone would pay to fix a piano that no one seemed to play.",
    "Mrs. Adair’s house was different. She was ninety-one and nearly blind, and she met us at the door with her hand already extended, as if she had been waiting there all morning. Her piano was a narrow upright with yellowed keys, and when my father played the first note, she winced.",
    "“It’s gone flat since spring,” she said. “Mostly the middle C. And the F above it has a buzz.”",
    "My father smiled—a small, private smile I had never seen him give a customer. “You’re right about the buzz,” he said. “Let’s see about the rest.”",
    "For an hour I watched him work, and for the first time I tried to hear what he heard. He would strike a key, and Mrs. Adair would tilt her head, and between them a kind of conversation passed that needed no words. Once she lifted one finger, and he stopped, turned the hammer a fraction, and struck the note again. She lowered her finger. I realized she had been tracking every adjustment.",
    "When he finished, she sat down and played a slow hymn, her hands finding the keys without hesitation. The music filled the small room. I could not have said what had changed, but something had—the notes seemed to lean toward one another, the way people do when they are listening closely.",
    "In the car, I asked my father how she knew about the F.",
    "“Same way I do,” he said. “She paid attention for seventy years.”",
    "The next morning, when he handed me the case, he unwrapped the tuning fork and held it out. “Strike it on your knee,” he said. “Then just listen. Don’t try to understand it yet.”"
  ] },
  p2: { title: "The Power of Doing Nothing", type: "Social science", text: [
    "When a new employee fills out the paperwork for a retirement savings plan, the decision seems simple: join or don’t. Economists long assumed that people would weigh the costs and benefits and choose whatever served them best. If saving for retirement was a good idea—and it almost always is—most workers would sign up.",
    "They didn’t. At many companies that required employees to opt in, fewer than half of new workers enrolled during their first year. The reason was not that the rest had carefully decided against saving. Many simply never got around to it. The form sat in a drawer; the deadline passed; the default, which was to save nothing, quietly took effect.",
    "Then some companies tried a small change. Instead of asking employees to opt in, they enrolled everyone automatically and allowed anyone who wished to leave the plan to opt out. The choices available were identical. No one was forced to save, and leaving took only a single form. Yet participation rose dramatically, in some cases to nearly ninety percent.",
    "Researchers call this the power of the default. A default is the option that takes effect when a person does nothing, and because doing nothing is easy, defaults tend to stick. Part of the explanation is simple inertia. Another part is that people often treat the default as a recommendation, assuming that whoever designed the form chose the sensible option.",
    "The idea has spread well beyond retirement plans. Governments have experimented with defaults for organ donation, energy companies with defaults for renewable power, and school cafeterias with the placement of healthy food. In each case, the people designing the choice—sometimes called “choice architects”—shape behavior without removing any options.",
    "Not everyone celebrates this development. Critics argue that defaults can be used to steer people toward choices that benefit the designer rather than the chooser: a magazine subscription that renews automatically, for example, or a phone plan that adds features unless a customer declines them. If defaults are powerful enough to help people, they warn, they are powerful enough to exploit them.",
    "Defenders respond that there is no neutral way to design a form. Every form has some default, even if it is only the blank box that means “no.” The real question, they argue, is not whether choices should be shaped, but who should shape them, and for whose benefit."
  ] },
  p3: { title: "Learning to Look", type: "Humanities", text: [
    "The first time I set up an easel in a museum, I felt like a trespasser. I had a permit—many museums still issue them to painters who want to copy works in the galleries—but the permit did not stop visitors from peering over my shoulder, and it certainly did not stop me from wondering what I was doing there. I was twenty-six, I had been painting for years, and I had come to spend three months copying a small landscape by a painter almost no one had heard of.",
    "My friends found the project baffling. Why copy, they asked, when I could make something of my own? Copying seemed to them a kind of surrender, an admission that the real work had already been done by someone else.",
    "I understood the objection. But I had begun to suspect that I did not know how to look at a painting, and that copying might teach me. When you stand before a canvas in the ordinary way, you see it whole, the way you see a face: instantly, and without noticing how the impression is made. When you copy it, that wholeness breaks apart. You have to decide where the sky ends and the hill begins, how many layers of glaze made a shadow, why a single stroke of white on a roof makes the whole afternoon seem warm.",
    "By the third week, I had stopped thinking of the painter as a name on a label. I knew where he had hesitated and where he had worked quickly. I could see a place near the horizon where he had painted over a tree, and I spent two days trying to understand why. In the end I decided the tree had made the picture too tidy; without it, the eye wandered, the way it does in a real field.",
    "Visitors’ questions changed, too. At first they asked whether I was allowed to be there. Later they asked what I was noticing, and I found myself pointing out details I could not have seen a month before.",
    "I finished the copy in late spring. It is not a great painting; it is not even a very good copy. But when I returned to my own work, I found I was making decisions more slowly and more deliberately, aware of choices I had once made without noticing. The original painter had not done my work for me. He had shown me how much of it there was."
  ] },
  p4: { title: "The Colorblind Chameleon of the Sea", type: "Natural science", text: [
    "An octopus resting on a reef can vanish in less than a second. Its skin darkens to match a shadow, blooms with spots to match a scatter of pebbles, or ripples with bands as a cloud passes overhead. Few animals change their appearance so quickly or so completely, and for decades the speed of the change was the main puzzle researchers tried to explain.",
    "The answer lies in the skin itself. Scattered across an octopus’s body are thousands of chromatophores, tiny elastic sacs filled with red, yellow, brown, or black pigment. Each sac is ringed by small muscles connected directly to the nervous system. When the muscles contract, they pull the sac open and the color spreads across a wider patch of skin; when they relax, the sac shrinks to a dot and the color nearly disappears. Because nerves control the muscles directly, an octopus can change color about as fast as a person can move a finger.",
    "Beneath the chromatophores lie other layers of cells that contain no pigment at all. Some reflect light to produce shimmering blues and greens; others scatter light to produce white. By combining these layers, an octopus can create patterns far more varied than its few pigments would suggest.",
    "Explaining how the color changes, however, raised a second and stranger question. Most octopuses appear to have only one type of light-detecting cell in their eyes, which suggests that they cannot distinguish colors the way humans do. How can an animal that may be colorblind match the colors around it so precisely?",
    "Researchers have proposed several answers. One group found that octopus skin contains light-sensitive proteins similar to those in eyes, suggesting that the skin itself may detect light and help guide the response. Another group pointed to the unusual U-shaped pupils of many octopuses. Such pupils, they argued, might bring different wavelengths of light into focus at slightly different distances, giving the animal a way to detect color that works very differently from our own.",
    "Neither explanation has been fully confirmed, and the two are not mutually exclusive. An octopus might rely on several sources of information at once. What is clear is that the animal’s remarkable disguise depends not only on what its skin can display but on what its body can sense—and that some of those senses may not resemble ours at all."
  ] }
};

/* Question bank. q: stem (HTML), p: optional prompt, c: choices, a: correct index, w: explanation.
   In explanations, {n} becomes the letter shown for choice n. */
const NC = "NO CHANGE";
const QB = [
  /* ---------- English: commas ---------- */
  { id: "e101", s: "E", k: "commas", q: "My <u>grandmother, who grew up on a dairy farm in Wisconsin</u> still wakes up before sunrise every morning.",
    c: [NC, "grandmother who grew up on a dairy farm in Wisconsin,", "grandmother, who grew up on a dairy farm in Wisconsin,", "grandmother who grew up, on a dairy farm in Wisconsin"], a: 2,
    w: "The clause adds extra information about someone already identified (“my grandmother”), so it is nonessential and needs a comma on <b>both</b> sides. As written, the pair opens but never closes. {1} closes it without opening it, and {3} breaks the clause in the middle." },
  { id: "e102", s: "E", k: "commas", q: "The <u>students who finished the lab early</u> were allowed to leave.",
    c: [NC, "students, who finished the lab early,", "students, who finished the lab early", "students who finished the lab early,"], a: 0,
    w: "This clause is <b>essential</b>: it tells you <i>which</i> students could leave. Remove it and the meaning changes to “all the students.” Essential information takes no commas. {2} and {3} also drop a single comma between the subject and its verb." },
  { id: "e103", s: "E", k: "commas", q: "The band’s lead <u>singer Marisol Vega</u> wrote every song on the new album.",
    c: [NC, "singer, Marisol Vega", "singer Marisol Vega,", "singer, Marisol Vega,"], a: 3,
    w: "A band has one lead singer, so her name is extra information and gets a comma on both sides. Compare “the poet Robert Frost,” which takes no commas: there are many poets, and the name tells you which one." },
  { id: "e104", s: "E", k: "commas", q: "The heavy rain that fell throughout the <u>night, flooded</u> several streets near the river.",
    c: [NC, "night flooded", "night, and flooded", "night, flooding"], a: 1,
    w: "The subject is the whole phrase “The heavy rain that fell throughout the night,” and its verb is “flooded.” Never split a subject from its verb with a single comma. {2} and {3} remove the main verb and leave a fragment." },
  { id: "e105", s: "E", k: "commas", q: "The museum’s newest exhibit features <u>paintings, by artists</u> from more than thirty countries.",
    c: [NC, "paintings, by artists,", "paintings by artists", "paintings by, artists"], a: 2,
    w: "“By artists from more than thirty countries” identifies the paintings and is tightly bound to that noun, so no comma belongs between them. Every comma on the ACT needs a reason. When there isn’t one, choose fewer commas." },

  /* ---------- English: sentence boundaries ---------- */
  { id: "e201", s: "E", k: "boundaries", q: "The storm knocked out power across the <u>county, crews</u> worked through the night to restore it.",
    c: [NC, "county crews", "county, and, crews", "county; crews"], a: 3,
    w: "Both halves are complete sentences. A comma alone makes a comma splice (NO CHANGE), and no punctuation makes a run-on ({1}). A semicolon works like a period here. {2} adds a stray comma after “and.”" },
  { id: "e202", s: "E", k: "boundaries", q: "Maya practiced the piece for hours every <u>day. Hoping to earn</u> a seat in the state orchestra.",
    c: [NC, "day, hoping to earn", "day. She hoping to earn", "day; hoping to earn"], a: 1,
    w: "“Hoping to earn a seat…” has no subject and no main verb, so it cannot stand alone (NO CHANGE and {2} leave fragments). A semicolon ({3}) also needs a complete sentence on both sides. Attach the phrase with a comma." },
  { id: "e203", s: "E", k: "boundaries", q: "The forecast called for <u>sunshine; however, the</u> picnic was ruined by a sudden downpour.",
    c: [NC, "sunshine, however, the", "sunshine however the", "sunshine, however the"], a: 0,
    w: "“However” is not a FANBOYS word (for, and, nor, but, or, yet, so), so commas alone can’t join two complete sentences around it. A semicolon before it and a comma after it is exactly right, so no change is needed." },
  { id: "e204", s: "E", k: "boundaries", q: "During the summer, Leo worked at his uncle’s <u>bakery; where he learned</u> to make sourdough from scratch.",
    c: [NC, "bakery. Where he learned", "bakery, where he learned", "bakery; he learning"], a: 2,
    w: "“Where he learned to make sourdough” is a dependent clause. It can’t stand alone, so it can’t follow a semicolon (NO CHANGE) or a period ({1}). Attach it with a comma. {3} isn’t a complete sentence either." },
  { id: "e205", s: "E", k: "boundaries", q: "Octopuses are remarkably <u>intelligent, they</u> can open jars, navigate mazes, and recognize individual people.",
    c: [NC, "intelligent they", "intelligent: they", "intelligent, and they,"], a: 2,
    w: "Two complete sentences can’t be joined by a comma alone (NO CHANGE) or by nothing ({1}). A colon works because the second sentence explains the first: it proves the intelligence. {3} adds a comma that splits “they” from its verb." },

  /* ---------- English: colons, dashes, apostrophes ---------- */
  { id: "e301", s: "E", k: "punct", q: "For the camping trip, we <u>packed: a tent,</u> two sleeping bags, and a portable stove.",
    c: [NC, "packed; a tent,", "packed, a tent,", "packed a tent,"], a: 3,
    w: "A colon must follow a complete sentence. “We packed” needs its object, and the list <i>is</i> the object, so nothing goes between the verb and the list. A correct colon would look like this: “we packed three essentials: a tent, …”" },
  { id: "e302", s: "E", k: "punct", q: "The old lighthouse—abandoned for nearly forty <u>years, still</u> draws photographers from all over the state.",
    c: [NC, "years; still", "years—still", "years still"], a: 2,
    w: "The interrupter opened with a dash, so it must close with a dash. Pairs always match: comma with comma, dash with dash, parenthesis with parenthesis." },
  { id: "e303", s: "E", k: "punct", q: "Both <u>teams’ coaches</u> agreed to postpone the game because of lightning.",
    c: [NC, "team’s coaches", "teams coaches", "teams’ coach’s"], a: 0,
    w: "“Both” means more than one team, so the possessive is plural: teams’. “Coaches” is just a plural noun that doesn’t own anything, so it takes no apostrophe." },
  { id: "e304", s: "E", k: "punct", q: "The company announced that <u>it’s</u> newest phone will be released in March.",
    c: [NC, "its’", "their", "its"], a: 3,
    w: "“It’s” always means “it is” or “it has.” Test it: “it is newest phone” makes no sense. The possessive is “its,” with no apostrophe, like “his.” “Its’” doesn’t exist, and “their” doesn’t agree with the singular “company.”" },
  { id: "e305", s: "E", k: "punct", q: "The three <u>researchers</u> discovery changed how doctors treat the disease.",
    c: [NC, "researcher’s", "researchers’", "researchers’s"], a: 2,
    w: "“Three” makes it plural, and the discovery belongs to them, so you need a plural possessive. For a plural noun ending in s, add only an apostrophe: researchers’." },
  { id: "e306", s: "E", k: "punct", q: "Many desert <u>animals, such as:</u> foxes, owls, and bats, are active mainly at night.",
    c: [NC, "animals such as:", "animals, such as,", "animals, such as"], a: 3,
    w: "Never put a colon after “such as” or “including.” The “such as” phrase is extra information, so it sits between two commas: one before “such as” and one after “bats.”" },

  /* ---------- English: agreement ---------- */
  { id: "e401", s: "E", k: "agreement", q: "The collection of rare coins that my uncle keeps in his study <u>are</u> worth more than his car.",
    c: [NC, "were", "is", "have been"], a: 2,
    w: "Strip out the extras: “The collection … is worth more than his car.” The subject is “collection,” which is singular, not “coins.” The other choices are all plural." },
  { id: "e402", s: "E", k: "agreement", q: "Each of the volunteers <u>have</u> signed up for a two-hour shift.",
    c: [NC, "has", "are", "were"], a: 1,
    w: "“Each” is singular. Think “each one has.” The phrase “of the volunteers” doesn’t change the subject." },
  { id: "e403", s: "E", k: "agreement", q: "Beyond the old stone wall <u>lies</u> a meadow of wildflowers and a small pond.",
    c: [NC, "is lying", "has laid", "lie"], a: 3,
    w: "Flip the sentence to find the subject: “A meadow of wildflowers and a small pond lie beyond the wall.” Two things joined by “and” make a plural subject, so the verb is “lie.” In inverted sentences the subject comes after the verb." },
  { id: "e404", s: "E", k: "agreement", q: "The city council voted to postpone the decision until <u>it</u> could review the new traffic study.",
    c: [NC, "they", "those", "one"], a: 0,
    w: "“Council” is one group, so the ACT treats it as singular: “it.” The same goes for team, company, committee, band, and family. No change needed." },
  { id: "e405", s: "E", k: "agreement", q: "When Priya handed the trophy to her sister, <u>she</u> started to cry.",
    c: [NC, "it", "her sister", "they"], a: 2,
    w: "“She” could mean Priya or her sister, so the pronoun is ambiguous. When a pronoun could point to two people, the ACT wants the noun itself." },
  { id: "e406", s: "E", k: "agreement", q: "Neither the coach nor the players <u>were</u> happy with the referee’s call.",
    c: [NC, "was", "is", "has been"], a: 0,
    w: "With “neither … nor” and “either … or,” the verb agrees with the subject closer to it. “Players” is plural, so “were” is right." },

  /* ---------- English: tense, case, idioms, comparisons ---------- */
  { id: "e501", s: "E", k: "usage", q: "Last spring, our class traveled to the state capital, toured the capitol building, and <u>meets</u> two state senators.",
    c: [NC, "will meet", "has met", "met"], a: 3,
    w: "“Last spring” sets the past tense, and the other verbs in the list (“traveled,” “toured”) are past. Keep the series consistent: “met.”" },
  { id: "e502", s: "E", k: "usage", q: "The coach handed the extra practice jerseys to Daniel and <u>I</u>.",
    c: [NC, "me", "myself", "mine"], a: 1,
    w: "Drop the other person: “handed the jerseys to I” sounds wrong, and “to me” sounds right. After a preposition like “to,” use the object form (me, him, her, us, them). “Myself” is only for when you are also the subject: “I taught myself.”" },
  { id: "e503", s: "E", k: "usage", q: "The author, <u>who</u> many critics had dismissed early in her career, won a national award at age sixty.",
    c: [NC, "whose", "whom", "which"], a: 2,
    w: "Rearrange the clause: “many critics had dismissed ___.” You’d say “dismissed her,” not “dismissed she,” so use the object form, “whom.” Shortcut: he goes with who, him goes with whom. Both end in m." },
  { id: "e504", s: "E", k: "usage", q: "Jamal was not capable <u>to finish</u> the marathon after injuring his ankle at mile ten.",
    c: [NC, "for finishing", "in finishing", "of finishing"], a: 3,
    w: "The idiom is “capable of” plus an -ing verb. Idiom questions test fixed word pairings, so read each choice in the sentence and trust the standard phrasing." },
  { id: "e505", s: "E", k: "usage", q: "This year’s science fair had <u>less</u> entries than last year’s, but the projects were more ambitious.",
    c: [NC, "lesser", "fewer", "least"], a: 2,
    w: "Use “fewer” for things you can count (entries, people, mistakes) and “less” for amounts you can’t (water, time, effort)." },
  { id: "e506", s: "E", k: "usage", q: "Denver’s population is much larger than <u>Boise</u>.",
    c: [NC, "Boise’s", "the city of Boise", "Boise is"], a: 1,
    w: "Compare like with like: a population with a population. “Denver’s population is larger than Boise’s [population].” As written, the sentence compares a population with a city." },
  { id: "e507", s: "E", k: "usage", q: "By the time the firefighters arrived, the fire <u>spreads</u> to the second floor.",
    c: [NC, "had spread", "has spread", "will have spread"], a: 1,
    w: "“By the time [something happened in the past]” signals an action that was already finished before that moment. That calls for the past perfect: “had spread.”" },

  /* ---------- English: modifiers and parallelism ---------- */
  { id: "e601", s: "E", k: "modifiers", q: "Walking through the forest at dawn, <u>the birdsong seemed louder than ever to Elena.</u>",
    c: [NC, "the birdsong, to Elena, seemed louder than ever.", "louder than ever, the birdsong seemed to Elena.", "Elena noticed that the birdsong was louder than ever."], a: 3,
    w: "An opening descriptive phrase describes whatever comes right after the comma. “Walking through the forest” has to be followed by the person walking, Elena, not the birdsong." },
  { id: "e602", s: "E", k: "modifiers", q: "<u>The museum displayed a dress that once belonged to a famous actress in a glass case.</u>",
    c: [NC, "The museum displayed a dress in a glass case that once belonged to a famous actress.", "The museum displayed, in a glass case, a dress that once belonged to a famous actress.", "A famous actress in a glass case once owned the dress that the museum displayed."], a: 2,
    w: "Keep each modifier next to what it describes. As written, the actress seems to be in the glass case. {1} makes the case sound like it belonged to the actress. Only {2} puts “in a glass case” with “displayed” and “that once belonged…” with “a dress.”" },
  { id: "e603", s: "E", k: "modifiers", q: "The new trainer told us to stretch before every run, drink plenty of water, and <u>that we should get</u> at least eight hours of sleep.",
    c: [NC, "getting", "to be getting", "get"], a: 3,
    w: "Items in a list must match. The list is “(to) stretch…, drink…, and get…”: the “to” on the first item carries over, so each item starts with a plain verb." },
  { id: "e604", s: "E", k: "modifiers", q: "For Ava, writing a poem is harder than <u>to write</u> an essay.",
    c: [NC, "writing", "she writes", "if she writes"], a: 1,
    w: "Comparisons must be parallel: “writing a poem is harder than writing an essay.” Match -ing with -ing." },
  { id: "e605", s: "E", k: "modifiers", q: "After finishing the final exam, <u>the students’ relief was obvious</u>.",
    c: [NC, "relief was obvious on the students’ faces", "the students were obviously relieved", "it was obvious that the students were relieved"], a: 2,
    w: "Who finished the exam? The students. So “the students” must come right after the comma. In NO CHANGE and {1}, “relief” finished the exam; in {3}, “it” did." },

  /* ---------- English: concision ---------- */
  { id: "e701", s: "E", k: "concision", q: "At the end of the meeting, the committee members <u>unanimously agreed together</u> to approve the budget.",
    c: [NC, "unanimously agreed", "agreed unanimously together as one", "all unanimously agreed in agreement"], a: 1,
    w: "“Unanimously” already means everyone agreed, so “together” repeats it. If the shortest choice is grammatical and keeps the meaning, it is usually right." },
  { id: "e702", s: "E", k: "concision", q: "The ancient <u>manuscript, which was very old,</u> was discovered in a monastery library.",
    c: [NC, "manuscript, which had aged over many years,", "manuscript, being old,", "manuscript"], a: 3,
    w: "“Ancient” already tells you it is old, so the clause adds nothing. Delete it, along with its commas." },
  { id: "e703", s: "E", k: "concision", q: "<u>Due to the fact that</u> the bridge was closed, we took the long way home.",
    c: [NC, "Owing to the fact that", "Because", "Being as how"], a: 2,
    w: "“Due to the fact that” is a wordy way to say “because.” Same meaning, fewer words. “Being as how” is also too informal." },
  { id: "e704", s: "E", k: "concision", q: "The two scientists <u>collaborated together jointly</u> on the research paper.",
    c: [NC, "collaborated together", "jointly collaborated together", "collaborated"], a: 3,
    w: "“Collaborate” already means “work together,” so “together” and “jointly” only repeat it." },
  { id: "e705", s: "E", k: "concision", q: "The <u>final outcome of the vote</u> surprised nearly everyone in the room.",
    c: [NC, "outcome of the vote", "final outcome result of the vote", "end outcome of the final vote"], a: 1,
    w: "An outcome is already the end result, so “final” is redundant. Say it once." },

  /* ---------- English: transitions ---------- */
  { id: "e801", s: "E", k: "transitions", q: "Electric cars produce no tailpipe emissions. <u>Therefore,</u> the electricity that charges them is often generated by burning coal or natural gas.",
    c: [NC, "For example,", "Similarly,", "However,"], a: 3,
    w: "The second sentence complicates the first: the car itself is clean, but its power source may not be. That is a contrast, so “However.” Name the relationship between the sentences before you look at the choices." },
  { id: "e802", s: "E", k: "transitions", q: "Honeybees share the location of food through a “waggle dance.” <u>For instance,</u> the angle of the dance indicates the direction of the food relative to the sun.",
    c: [NC, "Nevertheless,", "In contrast,", "Consequently,"], a: 0,
    w: "The second sentence gives a specific example of how the dance shares location, so “For instance” fits. There is no contrast and no cause and effect. Not every transition question needs a change." },
  { id: "e803", s: "E", k: "transitions", q: "The town’s only grocery store closed in March. <u>Likewise,</u> many residents now drive forty minutes to buy fresh produce.",
    c: [NC, "On the other hand,", "As a result,", "Even so,"], a: 2,
    w: "Cause (the store closed) leads to effect (long drives). “As a result” signals cause and effect. “Likewise” signals similarity, which doesn’t fit." },
  { id: "e804", s: "E", k: "transitions", q: "Most critics praised the film’s stunning visuals. <u>In addition,</u> several of them found the plot confusing and slow.",
    c: [NC, "Thus,", "Still,", "Furthermore,"], a: 2,
    w: "Praise followed by criticism is a contrast, so you need a word like “Still,” meaning “despite that.” “In addition” and “Furthermore” add a similar point; “Thus” signals a result." },
  { id: "e805", s: "E", k: "transitions", q: "The experiment failed twice, <u>so</u> the team refused to give up and redesigned the equipment.",
    c: [NC, "but", "and so", "because"], a: 1,
    w: "Failing twice would usually make someone quit, and this team didn’t. That surprise is a contrast, so use “but.”" },

  /* ---------- English: rhetorical skills ---------- */
  { id: "e901", s: "E", k: "rhetoric", q: "Mangrove forests protect coastlines by absorbing the force of storm waves. Their tangled roots trap sediment, slowly building up the shoreline over time. <u>Many tourists enjoy kayaking through mangrove tunnels in Florida.</u> Losing these forests leaves coastal towns far more exposed to flooding.",
    p: "The writer is considering deleting the underlined sentence. Should the writer make this deletion?",
    c: ["Yes, because it shifts the focus from how mangroves protect coastlines to a recreational activity.", "Yes, because it contradicts the claim that mangroves build up the shoreline.", "No, because it shows that mangroves are valuable to coastal towns.", "No, because it gives an example of the tangled roots described in the previous sentence."], a: 0,
    w: "The paragraph is about how mangroves protect coastlines, and kayaking is off topic. For add or delete questions, decide yes or no first, then pick the reason that is actually true." },
  { id: "e902", s: "E", k: "rhetoric", q: "The fire <u>moved through the canyon</u> before firefighters could set up a line.",
    p: "The writer wants to emphasize how quickly the wildfire spread. Which choice best accomplishes this goal?",
    c: [NC, "eventually made its way through the canyon", "affected the canyon", "raced through the entire canyon in under an hour"], a: 3,
    w: "The goal is speed. Only {3} delivers it, with a vivid verb (“raced”) and a specific detail (“under an hour”). In which-choice-best questions every option is usually grammatical, so match the stated goal exactly." },
  { id: "e903", s: "E", k: "rhetoric", q: "In his acceptance speech, the scientist thanked his colleagues, whose research had <u>majorly helped out</u> his own.",
    c: [NC, "kind of boosted", "significantly advanced", "totally pushed forward"], a: 2,
    w: "The sentence is formal, so the wording should be precise and formal. “Significantly advanced” fits; the other choices are casual." },
  { id: "e904", s: "E", k: "rhetoric", q: "Community gardens do more than grow vegetables. <span class=\"slot\">[ ? ]</span> They also give neighbors a reason to meet and work side by side.",
    p: "Which sentence, if added at the bracket, best supports the first sentence and leads into the last one?",
    c: ["In many cities, community gardens produce tomatoes, peppers, and squash.", "They encourage people to spend more time outdoors and stay physically active.", "Gardening tools can be expensive for beginners.", "Some community gardens are located on rooftops."], a: 1,
    w: "The first sentence promises benefits beyond vegetables, and the last sentence (“They also…”) adds a second benefit. {1} supplies the first one. {0} only mentions vegetables, and {2} and {3} are off topic." },
  { id: "e905", s: "E", k: "rhetoric", q: "Since the program launched in May, <u>it has offered drills, ladders, and sewing machines</u>.",
    p: "The writer wants to show how popular the library’s new tool-lending program has become. Which choice best accomplishes this goal?",
    c: [NC, "the library has stored the tools in its basement", "two librarians have managed the program", "residents have borrowed tools more than 3,000 times"], a: 3,
    w: "Popularity means people are using it. Only {3} shows demand. The other choices describe the program, not how popular it is." },

  /* ---------- Math: percents, ratios, rates ---------- */
  { id: "m101", s: "M", k: "percent", q: "A jacket originally priced at $80 is on sale for 25% off. An 8% sales tax is then applied to the sale price. What is the total cost of the jacket?",
    c: ["$55.20", "$60.00", "$64.80", "$66.40"], a: 2,
    w: "Apply the changes one at a time. Sale price: 80 × 0.75 = 60. With tax: 60 × 1.08 = 64.80. Combining them as “17% off” gives $66.40, but the tax is charged on the smaller, discounted price." },
  { id: "m102", s: "M", k: "percent", q: "A town’s population grew from 12,500 to 14,000. By what percent did the population increase?",
    c: ["1.5%", "10.7%", "12%", "15%"], a: 2,
    w: "Percent change = (new − old) ÷ old = 1,500 ÷ 12,500 = 0.12 = 12%. Dividing by the new value, 14,000, is the classic trap and gives about 10.7%." },
  { id: "m103", s: "M", k: "percent", q: "The ratio of juniors to seniors in a club is 3 : 5. If the club has 40 members, how many are seniors?",
    c: ["15", "24", "25", "30"], a: 2,
    w: "3 + 5 = 8 parts. 40 ÷ 8 = 5 members per part. Seniors: 5 parts × 5 = 25." },
  { id: "m104", s: "M", k: "percent", q: "A printer prints 45 pages in 3 minutes. At this rate, how many minutes will it take to print 330 pages?",
    c: ["7⅓", "15", "20", "22"], a: 3,
    w: "Rate = 45 ÷ 3 = 15 pages per minute. Time = 330 ÷ 15 = 22 minutes. (330 ÷ 45 = 7⅓ counts 3-minute blocks, not minutes.)" },
  { id: "m105", s: "M", k: "percent", q: "A car travels 150 miles on 6 gallons of gas. At the same rate, how many gallons does it need to travel 425 miles?",
    c: ["14", "15", "16", "17"], a: 3,
    w: "150 ÷ 6 = 25 miles per gallon, and 425 ÷ 25 = 17 gallons. Or set up a proportion: 150/6 = 425/x, so 150x = 2,550 and x = 17." },

  /* ---------- Math: lines, inequalities, systems ---------- */
  { id: "m201", s: "M", k: "linear", q: `What is the slope of the line through (−2, 5) and (4, −7)?`,
    c: ["−2", "−" + F(1, 2), F(1, 2), "2"], a: 0,
    w: "Slope = (y₂ − y₁) ÷ (x₂ − x₁) = (−7 − 5) ÷ (4 − (−2)) = −12 ÷ 6 = −2." },
  { id: "m202", s: "M", k: "linear", q: `Line ℓ has the equation 3${X("x")} − 4${X("y")} = 12. What is the slope of a line perpendicular to ℓ?`,
    c: ["−" + F(4, 3), "−" + F(3, 4), F(3, 4), F(4, 3)], a: 0,
    w: "Solve for y: −4y = −3x + 12, so y = (3/4)x − 3 and ℓ has slope 3/4. Perpendicular slopes are negative reciprocals: −4/3." },
  { id: "m203", s: "M", k: "linear", q: `If 2${X("x")} + ${X("y")} = 11 and ${X("x")} − ${X("y")} = 1, what is the value of ${X("x")} + ${X("y")}?`,
    c: ["5", "6", "7", "8"], a: 2,
    w: "Add the equations to eliminate y: 3x = 12, so x = 4. Then y = 11 − 2(4) = 3, and x + y = 7." },
  { id: "m204", s: "M", k: "linear", q: "Plan A costs $25 per month plus $0.10 per text message. Plan B costs $40 per month with unlimited texts. For how many texts in a month do the two plans cost the same?",
    c: ["150", "250", "400", "650"], a: 0,
    w: "Set the costs equal: 25 + 0.10t = 40, so 0.10t = 15 and t = 150. (400 ignores Plan A’s $25 base fee.)" },
  { id: "m205", s: "M", k: "linear", q: `What is the solution to 3(${X("x")} − 4) = 5${X("x")} + 6?`,
    c: ["−9", "−3", "3", "9"], a: 0,
    w: "Distribute: 3x − 12 = 5x + 6. Subtract 3x and 6 from both sides: −18 = 2x, so x = −9. Check: 3(−13) = −39 and 5(−9) + 6 = −39." },
  { id: "m206", s: "M", k: "linear", q: `Which of the following is the solution set of |2${X("x")} − 3| < 7?`,
    c: [`−5 < ${X("x")} < 2`, `${X("x")} < 5`, `${X("x")} < −2 or ${X("x")} > 5`, `−2 < ${X("x")} < 5`], a: 3,
    w: "|A| < 7 means −7 < A < 7. So −7 < 2x − 3 < 7, then −4 < 2x < 10, then −2 < x < 5. A less-than absolute value gives one connected interval; greater-than gives two pieces." },

  /* ---------- Math: quadratics ---------- */
  { id: "m301", s: "M", k: "quadratic", q: `What are the solutions of ${X("x")}<sup>2</sup> − 5${X("x")} − 14 = 0?`,
    c: ["x = −1 and x = 14", "x = −7 and x = 2", "x = 5 and x = −14", "x = −2 and x = 7"], a: 3,
    w: "Find two numbers that multiply to −14 and add to −5: −7 and 2. So (x − 7)(x + 2) = 0, which gives x = 7 or x = −2. The solutions have the opposite signs of the numbers inside the factors." },
  { id: "m302", s: "M", k: "quadratic", q: `What is the vertex of the parabola ${X("y")} = 2(${X("x")} − 3)<sup>2</sup> + 5?`,
    c: ["(−3, 5)", "(2, 5)", "(3, −5)", "(3, 5)"], a: 3,
    w: "Vertex form y = a(x − h)² + k has vertex (h, k). Here h = 3 (watch the minus sign inside) and k = 5, so the vertex is (3, 5)." },
  { id: "m303", s: "M", k: "quadratic", q: `For what value of ${X("k")} does ${X("x")}<sup>2</sup> + 6${X("x")} + ${X("k")} = 0 have exactly one real solution?`,
    c: ["3", "6", "9", "36"], a: 2,
    w: "Exactly one real solution means the discriminant is zero: 6² − 4(1)(k) = 0, so 36 = 4k and k = 9. Check: x² + 6x + 9 = (x + 3)²." },
  { id: "m304", s: "M", k: "quadratic", q: `If (${X("x")} + 3)(${X("x")} − 3) = 40, what is the value of ${X("x")}<sup>2</sup>?`,
    c: ["31", "40", "43", "49"], a: 3,
    w: "(x + 3)(x − 3) is a difference of squares: x² − 9. So x² − 9 = 40 and x² = 49. You never need x itself." },
  { id: "m305", s: "M", k: "quadratic", q: `What is the product of the solutions of 2${X("x")}<sup>2</sup> − 8${X("x")} + 6 = 0?`,
    c: ["−3", "3", "4", "6"], a: 1,
    w: "Divide by 2: x² − 4x + 3 = 0, so (x − 1)(x − 3) = 0 and x = 1 or 3. Product = 3. Shortcut: the product of the roots is c ÷ a = 6 ÷ 2 = 3." },

  /* ---------- Math: functions ---------- */
  { id: "m401", s: "M", k: "functions", q: `If ${X("f")}(${X("x")}) = 2${X("x")}<sup>2</sup> − 3${X("x")}, what is ${X("f")}(−2)?`,
    c: ["−14", "2", "8", "14"], a: 3,
    w: "Substitute with parentheses: 2(−2)² − 3(−2) = 2(4) + 6 = 14. The traps come from squaring −2 as −4 or losing the sign in −3(−2)." },
  { id: "m402", s: "M", k: "functions", q: `If ${X("f")}(${X("x")}) = ${X("x")} + 4 and ${X("g")}(${X("x")}) = 3${X("x")} − 1, what is ${X("f")}(${X("g")}(2))?`,
    c: ["9", "11", "17", "18"], a: 0,
    w: "Work from the inside out. g(2) = 3(2) − 1 = 5, then f(5) = 5 + 4 = 9. The trap is g(f(2)) = g(6) = 17. Order matters." },
  { id: "m403", s: "M", k: "functions", q: `The graph of ${X("y")} = ${X("f")}(${X("x")}) is shifted 3 units to the left and 2 units down. Which equation describes the new graph?`,
    c: ["y = f(x − 3) − 2", "y = f(x + 3) + 2", "y = f(x − 2) + 3", "y = f(x + 3) − 2"], a: 3,
    w: "Changes inside the parentheses move the graph sideways and work backward: x + 3 shifts it LEFT 3. Changes outside work as expected: − 2 shifts it down 2." },
  { id: "m404", s: "M", k: "functions", q: `Which value of ${X("x")} is NOT in the domain of ${X("f")}(${X("x")}) = ${F("x + 1", "x − 4")}?`,
    c: ["−4", "−1", "0", "4"], a: 3,
    w: "Division by zero is undefined, so exclude any x that makes the denominator 0: x − 4 = 0 gives x = 4. At x = −1 the function just equals 0, which is fine." },
  { id: "m405", s: "M", k: "functions", q: `If ${X("f")}(${X("x")}) = 3${X("x")} − 7, what is the value of ${X("f")}<sup>−1</sup>(5)?`,
    c: [F(1, 8), "4", "8", "22"], a: 1,
    w: "f⁻¹(5) asks which input gives an output of 5. Solve 3x − 7 = 5: 3x = 12, so x = 4. The traps are f(5) = 8 and 1/f(5) = 1/8. The −1 is not an exponent here." },

  /* ---------- Math: exponents, radicals, logs ---------- */
  { id: "m501", s: "M", k: "exponents", q: `Which expression is equivalent to (2${X("x")}<sup>3</sup>)<sup>4</sup>?`,
    c: [`8${X("x")}<sup>7</sup>`, `8${X("x")}<sup>12</sup>`, `16${X("x")}<sup>7</sup>`, `16${X("x")}<sup>12</sup>`], a: 3,
    w: "Raise each factor to the 4th power: 2⁴ = 16, and (x³)⁴ = x¹² because a power of a power multiplies the exponents (3 × 4)." },
  { id: "m502", s: "M", k: "exponents", q: "Which of the following is equal to √72?",
    c: ["3√6", "4√6", "6√2", "8√3"], a: 2,
    w: "Pull out the largest perfect-square factor: 72 = 36 × 2, so √72 = √36 × √2 = 6√2. Check a trap: 4√6 = √(16 × 6) = √96." },
  { id: "m503", s: "M", k: "exponents", q: `If 2<sup>${X("x")} + 1</sup> = 32, what is the value of ${X("x")}?`,
    c: ["4", "5", "16", "31"], a: 0,
    w: "Write 32 as a power of 2: 32 = 2⁵. Same base means equal exponents: x + 1 = 5, so x = 4." },
  { id: "m504", s: "M", k: "exponents", q: "What is the value of log<sub>3</sub> 81?",
    c: ["3", "4", "9", "27"], a: 1,
    w: "log₃ 81 asks: 3 to what power gives 81? Since 3⁴ = 81, the answer is 4." },
  { id: "m505", s: "M", k: "exponents", q: "What is the value of 8<sup>2/3</sup>?",
    c: ["2", "4", "5⅓", "16"], a: 1,
    w: "The denominator of the exponent is a root and the numerator is a power: 8^(2/3) = (cube root of 8)² = 2² = 4. The trap, 8 × 2/3 = 5⅓, treats the exponent as a multiplier." },

  /* ---------- Math: geometry ---------- */
  { id: "m601", s: "M", k: "geometry", q: "A right triangle has legs of length 9 and 12. What is the length of the hypotenuse?",
    c: ["13", "14", "15", "21"], a: 2,
    w: "9² + 12² = 81 + 144 = 225, and √225 = 15. Faster: 9-12-15 is the 3-4-5 triple multiplied by 3." },
  { id: "m602", s: "M", k: "geometry", q: "In a 30°-60°-90° triangle, the side opposite the 30° angle has length 7. What is the length of the hypotenuse?",
    c: ["7√2", "7√3", "14", "14√3"], a: 2,
    w: "The sides of a 30°-60°-90° triangle are in the ratio x : x√3 : 2x, with x opposite 30°. So x = 7, and the hypotenuse is 2x = 14." },
  { id: "m603", s: "M", k: "geometry", q: "Two angles of a triangle measure 48° and 67°. What is the measure of the third angle?",
    c: ["65°", "75°", "105°", "115°"], a: 0,
    w: "The angles of a triangle sum to 180°: 180 − 48 − 67 = 65°. (115° is the sum of the two given angles, a common slip.)" },
  { id: "m604", s: "M", k: "geometry", q: "Triangle ABC is similar to triangle DEF, with A, B, and C corresponding to D, E, and F. If AB = 6, BC = 9, and DE = 10, what is EF?",
    c: ["12", "13", "15", "18"], a: 2,
    w: "Corresponding sides share one scale factor: DE ÷ AB = 10 ÷ 6 = 5/3. So EF = 9 × 5/3 = 15. (13 comes from adding 4 instead of multiplying.)" },
  { id: "m605", s: "M", k: "geometry", q: "A closed rectangular box measures 4 inches by 5 inches by 6 inches. What is its total surface area, in square inches?",
    c: ["74", "120", "148", "240"], a: 2,
    w: "A box has three pairs of matching faces: 2(4 × 5) + 2(4 × 6) + 2(5 × 6) = 40 + 48 + 60 = 148. (120 is the volume; 74 forgets to double.)" },
  { id: "m606", s: "M", k: "geometry", q: "A square has a diagonal of length 10√2. What is the area of the square?",
    c: ["50", "100", "100√2", "200"], a: 1,
    w: "The diagonal splits the square into 45°-45°-90° triangles with sides x, x, x√2. So x√2 = 10√2 gives x = 10, and the area is 10² = 100." },

  /* ---------- Math: circles and coordinates ---------- */
  { id: "m701", s: "M", k: "circles", q: `What are the center and radius of the circle (${X("x")} − 2)<sup>2</sup> + (${X("y")} + 5)<sup>2</sup> = 49?`,
    c: ["Center (2, −5), radius 7", "Center (−2, 5), radius 7", "Center (2, −5), radius 49", "Center (−2, 5), radius 49"], a: 0,
    w: "In (x − h)² + (y − k)² = r², the center is (h, k) and the radius is √(r²). Since y + 5 = y − (−5), k = −5. Center (2, −5), radius √49 = 7." },
  { id: "m702", s: "M", k: "circles", q: "A circle has a circumference of 18π. What is its area?",
    c: ["9π", "36π", "81π", "324π"], a: 2,
    w: "Circumference = 2πr = 18π, so r = 9. Area = πr² = 81π. (324π uses the diameter, 18, as the radius.)" },
  { id: "m703", s: "M", k: "circles", q: "What is the distance between the points (1, 2) and (7, 10)?",
    c: ["6", "8", "10", "14"], a: 2,
    w: "Distance = √((7 − 1)² + (10 − 2)²) = √(36 + 64) = √100 = 10. You can also spot the 6-8-10 right triangle, a 3-4-5 triple doubled." },
  { id: "m704", s: "M", k: "circles", q: "What is the midpoint of the segment with endpoints (−3, 8) and (5, −2)?",
    c: ["(1, 3)", "(2, 6)", "(4, 5)", "(8, −10)"], a: 0,
    w: "Average the coordinates: ((−3 + 5) ÷ 2, (8 + (−2)) ÷ 2) = (1, 3). (4, 5) comes from subtracting the coordinates instead of adding them." },
  { id: "m705", s: "M", k: "circles", q: "In a circle with radius 12, a central angle of 60° intercepts an arc. What is the length of that arc?",
    c: ["π", "2π", "3π", "4π"], a: 3,
    w: "An arc is a fraction of the circumference: (60 ÷ 360) × 2π(12) = (1/6)(24π) = 4π. (2π uses πr instead of 2πr.)" },

  /* ---------- Math: trigonometry ---------- */
  { id: "m801", s: "M", k: "trig", q: "In right triangle ABC, angle C is the right angle, AC = 5, BC = 12, and AB = 13. What is sin A?",
    c: [F(5, 13), F(5, 12), F(12, 13), F(12, 5)], a: 2,
    w: "SOH: sine = opposite ÷ hypotenuse. The side opposite angle A is BC = 12, and the hypotenuse is AB = 13. So sin A = 12/13." },
  { id: "m802", s: "M", k: "trig", q: `If cos ${X("θ")} = ${F(3, 5)} and ${X("θ")} is an acute angle, what is tan ${X("θ")}?`,
    c: [F(3, 4), F(4, 5), F(4, 3), F(5, 3)], a: 2,
    w: "Draw a right triangle with adjacent side 3 and hypotenuse 5. The opposite side is 4 (a 3-4-5 triangle). tan θ = opposite ÷ adjacent = 4/3." },
  { id: "m803", s: "M", k: "trig", q: "A 20-foot ladder leans against a vertical wall and makes a 70° angle with the level ground. Which expression gives the height, in feet, where the ladder touches the wall?",
    c: ["20 sin 70°", "20 cos 70°", "20 tan 70°", F("20", "sin 70°")], a: 0,
    w: "The ladder is the hypotenuse (20). The height is opposite the 70° angle, so sin 70° = height ÷ 20, and height = 20 sin 70°." },
  { id: "m804", s: "M", k: "trig", q: "What is the value of cos 120°?",
    c: ["−" + F("√3", 2), "−" + F(1, 2), F(1, 2), F("√3", 2)], a: 1,
    w: "120° is in Quadrant II, where cosine is negative. Its reference angle is 180° − 120° = 60°, and cos 60° = 1/2. So cos 120° = −1/2." },
  { id: "m805", s: "M", k: "trig", q: `What is the period of ${X("y")} = 3 sin(2${X("x")})?`,
    c: [F("π", 2), "π", "2π", "6π"], a: 1,
    w: "For y = a sin(bx), the period is 2π ÷ |b| = 2π ÷ 2 = π. The 3 is the amplitude (height), which doesn’t affect the period." },
  { id: "m806", s: "M", k: "trig", q: "What is the value of sin<sup>2</sup>(37°) + cos<sup>2</sup>(37°)?",
    c: ["0", F(1, 2), "1", "37"], a: 2,
    w: "This is the Pythagorean identity: sin²θ + cos²θ = 1 for every angle θ. No calculator needed." },

  /* ---------- Math: probability and statistics ---------- */
  { id: "m901", s: "M", k: "stats", q: "The mean of five numbers is 18. Four of the numbers are 12, 15, 20, and 25. What is the fifth number?",
    c: ["14", "16", "17", "18"], a: 3,
    w: "Mean × count = sum: 18 × 5 = 90. The four known numbers sum to 72, so the fifth is 90 − 72 = 18." },
  { id: "m902", s: "M", k: "stats", q: "What is the median of the data set 7, 3, 9, 3, 12, 5?",
    c: ["5", "6", "6.5", "7"], a: 1,
    w: "Sort first: 3, 3, 5, 7, 9, 12. With an even count, the median is the mean of the two middle values: (5 + 7) ÷ 2 = 6. (6.5 is the mean of all six.)" },
  { id: "m903", s: "M", k: "stats", q: "A bag contains 4 red, 5 blue, and 3 green marbles. Two marbles are drawn at random without replacement. What is the probability that both are red?",
    c: [F(1, 12), F(1, 11), F(1, 9), F(1, 3)], a: 1,
    w: "First draw: 4/12. Without replacement, 11 marbles remain and 3 are red: 3/11. Multiply: (4/12)(3/11) = 12/132 = 1/11. (1/9 is the with-replacement answer.)" },
  { id: "m904", s: "M", k: "stats", q: "A restaurant offers 4 appetizers, 6 entrées, and 3 desserts. How many different meals consist of one appetizer, one entrée, and one dessert?",
    c: ["13", "24", "72", "144"], a: 2,
    w: "Multiply the number of options at each step: 4 × 6 × 3 = 72. Adding them (13) is the trap." },
  { id: "m905", s: "M", k: "stats", q: "Each data set below has a mean of 5. Which one has the greatest standard deviation?",
    c: ["5, 5, 5, 5", "4, 5, 5, 6", "3, 4, 6, 7", "1, 5, 5, 9"], a: 3,
    w: "Standard deviation measures how far values spread from the mean. The set with values farthest from 5 (1 and 9 are each 4 away) has the greatest spread. No calculation needed." },

  /* ---------- Math: complex numbers, matrices, sequences ---------- */
  { id: "m1001", s: "M", k: "advanced", q: `What is (3 + 2${X("i")})(1 − 4${X("i")})? (Note: ${X("i")}<sup>2</sup> = −1)`,
    c: ["−5 − 10i", "3 − 8i", "11 − 10i", "11 + 10i"], a: 2,
    w: "FOIL: 3 − 12i + 2i − 8i² = 3 − 10i − 8(−1) = 11 − 10i. Treating i² as +1 gives the trap, −5 − 10i." },
  { id: "m1002", s: "M", k: "advanced", q: `What is the value of ${X("i")}<sup>23</sup>? (Note: ${X("i")}<sup>2</sup> = −1)`,
    c: ["1", "i", "−1", "−i"], a: 3,
    w: "Powers of i repeat every 4: i, −1, −i, 1. 23 ÷ 4 leaves a remainder of 3, so i²³ = i³ = −i." },
  { id: "m1003", s: "M", k: "advanced", q: `What is the determinant of the matrix ${MX(4, 3, 2, 5)}?`,
    c: ["−14", "2", "14", "26"], a: 2,
    w: "For a 2×2 matrix with rows (a, b) and (c, d), the determinant is ad − bc = (4)(5) − (3)(2) = 20 − 6 = 14. (26 adds instead of subtracting.)" },
  { id: "m1004", s: "M", k: "advanced", q: "The first term of an arithmetic sequence is 7, and the common difference is 4. What is the 20th term?",
    c: ["75", "79", "80", "83"], a: 3,
    w: "aₙ = a₁ + (n − 1)d = 7 + 19 × 4 = 83. Using 18 steps instead of 19 gives 79; the first term already counts as one." },
  { id: "m1005", s: "M", k: "advanced", q: "What is the 8th term of the geometric sequence 3, 6, 12, 24, …?",
    c: ["192", "384", "768", "1,536"], a: 1,
    w: "aₙ = a₁ × rⁿ⁻¹ = 3 × 2⁷ = 3 × 128 = 384. (192 is the 7th term; using 2⁸ gives 768.)" },

  /* ---------- Reading: The Tuner ---------- */
  { id: "r101", s: "R", k: "rmain", psg: "p1", q: "Which choice best describes the main purpose of the passage?",
    c: ["To show how an experience on the job changes the narrator’s understanding of listening", "To describe how pianos are tuned and why they go out of tune", "To compare the narrator’s father with a customer who once tuned pianos herself", "To explain why the narrator decides to become a piano tuner"], a: 0,
    w: "The passage builds to the narrator learning, through Mrs. Adair, that careful listening is a skill, and it ends with the father inviting the narrator to start. {1} is too technical, {2} invents a fact, and {3} goes too far: the narrator never chooses a career." },
  { id: "r102", s: "R", k: "rdetail", psg: "p1", q: "According to the passage, before the visit to Mrs. Adair’s house, the narrator spent most appointments:",
    c: ["helping the father adjust the tuning hammer.", "playing songs on customers’ pianos.", "asking customers how often they played.", "reading in the car or counting ceiling tiles."], a: 3,
    w: "Paragraph 2 says the narrator “spent those hours reading in the car or counting ceiling tiles.” Detail questions reward going back to the text instead of answering from memory." },
  { id: "r103", s: "R", k: "rinfer", psg: "p1", q: "The father’s “small, private smile” (paragraph 5) most strongly suggests that he:",
    c: ["was amused that Mrs. Adair had misjudged the problem.", "was relieved the job would be quick.", "recognized that Mrs. Adair heard the piano as precisely as he did.", "was embarrassed that a customer noticed something first."], a: 2,
    w: "Mrs. Adair names the buzz correctly, he confirms it (“You’re right”), and later he says she knows the “same way I do.” The smile shows recognition of a fellow careful listener. {0} contradicts the text, since she was right." },
  { id: "r104", s: "R", k: "rvocab", psg: "p1", q: "As it is used in paragraph 6, the word <i>tracking</i> most nearly means:",
    c: ["following closely.", "leaving marks on.", "hunting down.", "recording in writing."], a: 0,
    w: "Mrs. Adair lifts and lowers a finger in response to each change, so she is following each adjustment closely. Swap each choice into the sentence; only “following closely” fits." },
  { id: "r105", s: "R", k: "rfunc", psg: "p1", q: "The description of the notes seeming to “lean toward one another” (paragraph 7) mainly serves to:",
    c: ["explain the mechanical process of tuning a piano.", "criticize Mrs. Adair’s playing as too slow.", "show that the piano still needed more repairs.", "suggest the narrator could sense the change even without words for it."], a: 3,
    w: "The sentence begins “I could not have said what had changed, but something had.” The image captures a difference the narrator now perceives but cannot name in technical terms." },
  { id: "r106", s: "R", k: "rinfer", psg: "p1", q: "The father’s decision to hand the narrator the tuning fork at the end of the passage most strongly suggests that he:",
    c: ["no longer needs the tuning fork for his work.", "wants the narrator to begin developing the kind of attention Mrs. Adair has.", "is punishing the narrator for being bored at earlier appointments.", "expects the narrator to take over the business by the end of summer."], a: 1,
    w: "Earlier he never let the narrator touch the fork. After the narrator gets curious about how Mrs. Adair heard the F, he offers it with the instruction to “just listen.” That is an invitation to start learning. {3} overreaches." },

  /* ---------- Reading: The Power of Doing Nothing ---------- */
  { id: "r201", s: "R", k: "rmain", psg: "p2", q: "The main idea of the passage is that:",
    c: ["most employees dislike filling out paperwork.", "economists have proven that people always choose what is best for them.", "companies should be required by law to enroll workers in retirement plans.", "the option that takes effect when people do nothing can strongly shape their decisions."], a: 3,

function buildPlan() {
  const start = S.planStart, test = S.testDate;
  const total = daysBetween(start, test);
  if (total < 1) return { weeks: [], cw: 0, W: 0 };
  const W = Math.max(1, Math.ceil(total / 7));
  const weeks = [];
  for (let i = 0; i < W; i++) {
    let end = addDays(start, i * 7 + 6); if (end > test) end = test;
    weeks.push({ n: i + 1, start: addDays(start, i * 7), end: end, focus: [], tasks: [], title: "" });
  }
  const taper = W >= 2;
  const cW = taper ? W - 1 : W;
  const short = cW <= 3;
  const mods = MODULES.filter((m) => !short || PRIORITY.indexOf(m.id) >= 0);
  const place = (list, span) => { span = Math.max(1, Math.min(span, cW)); list.forEach((m, i) => { weeks[Math.min(span - 1, Math.floor((i * span) / list.length))].focus.push(m); }); };
  const eSpan = Math.max(1, Math.ceil(cW * 0.65));
  const mSpan = cW >= 4 ? cW - 1 : cW;
  place(mods.filter((m) => m.sec === "E"), eSpan);
  place(mods.filter((m) => m.sec === "M"), mSpan);
  place(mods.filter((m) => m.sec === "R"), mSpan);
  const pt = [];
  if (cW >= 5) pt.push(1);
  if (cW >= 3) pt.push(Math.max(2, Math.round(cW * 0.55)));
  if (cW >= 8) pt.push(Math.round(cW * 0.8));
  if (cW >= 2) pt.push(cW);
  const ptW = pt.filter((w, i) => pt.indexOf(w) === i && w >= 1 && w <= cW).sort((a, b) => a - b);
  const n = drillSize();
  weeks.forEach((w, i) => {
    if (taper && i === W - 1) { w.title = "Test week: light review, rest, logistics"; w.tasks = taperTasks(); return; }
    const t = w.tasks;
    w.focus.forEach((m) => {
      if (m.sec !== "R") {
        const sk = SK[m.skill];
        t.push({ id: m.id, sec: m.sec, label: sk.name, sub: "Read the rule, then drill " + n + " questions untimed. Read every explanation, even on the ones you get right.", act: { type: "drill", sec: m.sec, skill: m.skill }, act2: { type: "pb", sec: m.sec, skill: m.skill } });
      } else if (m.psg) {
        const p = PASSAGES[m.psg];
        t.push({ id: m.id, sec: "R", label: m.title, sub: "Read the Reading method, then do “" + p.title + "” (" + p.type.toLowerCase() + ") at test pace.", act: { type: "psg", psg: m.psg }, act2: { type: "pb", sec: "R" } });
      } else {
        t.push({ id: m.id, sec: "R", label: "Reading stamina: a full timed section", sub: "Do the Reading section of an official practice test with the pacing timer running. Log each miss in Review.", act: { type: "pacer", sec: "R" }, act2: { type: "link", href: LINKS.practice, text: "ACT practice tests" } });
      }
    });
    if (i >= eSpan && !w.focus.some((m) => m.sec === "E")) t.push({ id: "w" + w.n + "-emix", sec: "E", label: "English mixed drill", sub: n + " questions across every rule, so English stays sharp.", act: { type: "drill", sec: "E" } });
    const k = ptW.indexOf(w.n);
    if (k >= 0) {
      const last = k === ptW.length - 1 && ptW.length > 1;
      const name = k < 2 ? "ACT Practice Test " + (k + 1) : "another official practice test";
      t.push({ id: "pt" + (k + 1), sec: "X", label: (last ? "Dress rehearsal: " : "Full practice test: ") + name, sub: "English, Math, and Reading in one timed sitting on a weekend morning, like test day. Then log the scores.", act: { type: "link", href: LINKS.practice, text: "Open ACT practice tests" }, act2: { type: "tab", tab: "scores", text: "Log scores" } });
      t.push({ id: "pt" + (k + 1) + "-review", sec: "X", label: "Review every miss from that test", sub: "Log each miss in Review so the skill map catches the pattern.", act: { type: "tab", tab: "review", text: "Open Review" } });
    }
    t.push({ id: "w" + w.n + "-review", sec: "X", label: "Clear the mistakes that are due", sub: "Missed questions come back after 1, 3, and 7 days.", act: { type: "review" } });
    const names = w.focus.map((m) => (m.sec === "R" ? RSHORT[m.id] : SHORT[m.skill]));
    w.title = names.length ? cap(joinList(names)) + (k >= 0 ? ", plus a practice test" : "") : (k >= 0 ? "Full practice test and review" : "Mixed practice and review");
  });

}
function nextUp(plan, k) {
  const out = [];
  if (!plan.weeks.length) return out;
  plan.weeks.slice(0, plan.cw - 1).forEach((w) => w.tasks.forEach((t) => { if (!S.done[t.id] && !/^w\d+-/.test(t.id) && out.length < k) out.push(Object.assign({ late: true }, t)); }));
  const cur = plan.weeks[plan.cw - 1];
  if (cur) cur.tasks.forEach((t) => { if (!S.done[t.id] && out.length < k) out.push(t); });
  const nx = plan.weeks[plan.cw];
  if (nx) nx.tasks.forEach((t) => { if (!S.done[t.id] && !/^w\d+-/.test(t.id) && out.length < k) out.push(Object.assign({ ahead: true }, t)); });
  return out;
}

function pickQuestions(sec, skill, n) {

  if (skill) {
    const main = pool.filter((q) => q.k === skill).sort((a, b) => rank(a) - rank(b)).slice(0, n);
    const fill = pool.filter((q) => q.k !== skill).sort((a, b) => rank(a) - rank(b)).slice(0, Math.min(4, Math.max(0, n - main.length)));
    return main.map((q) => q.id).concat(shuffle(fill).map((q) => q.id));
