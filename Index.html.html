  return "Write 5 original practice questions for the English section of the current ACT (the enhanced ACT).\nSkill: " + sk.name + ".\nRule summary: " + sk.rule + "\nDifficulty: medium to hard, for a student who scores 25 in English and wants 31 or higher.\n\n" +
    "Each question is a short passage excerpt (1 to 3 sentences) with exactly one underlined portion, marked [u]like this[/u]. The four choices replace the underlined portion, and the first choice is exactly \"NO CHANGE\". Make NO CHANGE correct for about one question in four. For rhetorical skills you may instead put a question in \"prompt\" (for example \"Which choice best...\") and give four complete choices.\n" +
    "Exactly one choice must be correct under standard written English as the ACT tests it, and each wrong choice must fail for a specific reason. Vary which position is correct. Use fresh everyday, science, history, or arts topics. Check every answer carefully before replying.\n\n" +
    "Reply with only a JSON array, no other text:\n[{\"stem\": \"sentence with [u]underlined part[/u]\", \"prompt\": \"\", \"choices\": [\"NO CHANGE\", \"...\", \"...\", \"...\"], \"answer\": 0, \"why\": \"2 to 4 sentences: name the rule, say why the answer works, and why the most tempting wrong choice fails.\"}]";
}
function genPromptM(sk) {
  return "Write 5 original multiple-choice questions for the Math section of the current ACT, four answer choices each.\nTopic: " + sk.name + ". Key ideas: " + sk.rule + "\nDifficulty: medium to hard (like ACT questions 20 to 40 of 45), for a student scoring 26 who wants 29 or higher.\n" +
    "Write math in plain text with Unicode symbols: x², √, π, θ, ≤, ≥, −, and fractions like 3/4. Put numeric choices in increasing order, and make each wrong choice the result of a specific, common mistake.\nSolve every problem completely before writing it, and make sure exactly one choice is correct.\n\n" +
    "Reply with only a JSON array, no other text:\n[{\"stem\": \"...\", \"choices\": [\"...\", \"...\", \"...\", \"...\"], \"answer\": 0, \"why\": \"A short step-by-step solution in 2 to 5 steps, ending with the most common trap.\"}]";
}
function genPromptR(type) {
  return "Write one original passage for the Reading section of the current ACT, plus 6 questions about it.\nPassage type: " + type + ". Length: 420 to 520 words in 5 to 8 paragraphs. Make it genuinely interesting. Use fiction or general ideas, and don't invent statistics or quotes from real people.\n" +
    "Write one question of each kind: main idea, a detail, an inference, a word in context, the function of a paragraph or sentence, and the author's attitude or a perspective in the passage. Refer to paragraphs by number (\"paragraph 3\"). Four choices each; exactly one is clearly supported by the text, and each wrong choice is tempting for a specific reason (too extreme, half right, reversed, or off topic).\n\n" +
    "Reply with only a JSON object, no other text:\n{\"title\": \"...\", \"type\": \"" + type + "\", \"paragraphs\": [\"...\", \"...\"], \"questions\": [{\"skill\": \"rmain or rdetail or rinfer or rvocab or rfunc or rview\", \"q\": \"...\", \"choices\": [\"...\", \"...\", \"...\", \"...\"], \"answer\": 0, \"why\": \"1 to 3 sentences citing the paragraph that proves it.\"}]}";
}
function okChoices(c) { return Array.isArray(c) && c.length === 4 && c.every((x) => typeof x === "string" && x.trim()); }
function pruneAI() {
  const ids = Object.keys(S.aiq).sort((a, b) => (S.aiq[a].t || 0) - (S.aiq[b].t || 0));
  let extra = ids.length - 150;
  for (let i = 0; i < ids.length && extra > 0; i++) { if (S.miss[ids[i]]) continue; delete S.aiq[ids[i]]; delete S.att[ids[i]]; extra--; }
  Object.keys(S.aip).forEach((pid) => { if (!Object.keys(S.aiq).some((id) => S.aiq[id].psg === pid)) delete S.aip[pid]; });
}
function storeAIQuestions(data, sec, skill) {
  const arr = Array.isArray(data) ? data : data && Array.isArray(data.questions) ? data.questions : [];
  const ids = [];
  arr.forEach((o) => {
    if (!o || typeof o.stem !== "string" || !okChoices(o.choices)) return;
    const a = parseInt(o.answer, 10); if (!(a >= 0 && a <= 3)) return;
    const id = uid("ai");
    S.aiq[id] = { id: id, s: sec, k: skill, ai: 1, q: fmtAI(o.stem), p: o.prompt ? fmtAI(o.prompt) : "", c: o.choices.map(fmtAI), a: a, w: fmtAI(o.why || ""), t: Date.now() };
    ids.push(id);
  });
  pruneAI();
  return ids;
}
function storeAIPassage(d) {
  if (!d || !Array.isArray(d.paragraphs) || !Array.isArray(d.questions)) return [];
  const paras = d.paragraphs.filter((p) => typeof p === "string" && p.trim()).map((p) => p.trim());
  if (paras.length < 3) return [];
  const pid = uid("aip");
  S.aip[pid] = { title: String(d.title || "New passage").slice(0, 80), type: String(d.type || gen.rtype).slice(0, 40), text: paras, ai: 1, t: Date.now() };
  const ids = [];
  d.questions.forEach((o) => {
    if (!o || typeof o.q !== "string" || !okChoices(o.choices)) return;
    const a = parseInt(o.answer, 10); if (!(a >= 0 && a <= 3)) return;
    const id = uid("ai");
    S.aiq[id] = { id: id, s: "R", k: SK[o.skill] && SK[o.skill].sec === "R" ? o.skill : "rdetail", ai: 1, psg: pid, q: fmtAI(o.q), c: o.choices.map(fmtAI), a: a, w: fmtAI(o.why || ""), t: Date.now() };
    ids.push(id);
  });
  if (!ids.length) delete S.aip[pid];
  pruneAI();
  return ids;
}
async function aiGenerate() {
  if (!sampleFn || gen.busy) return;
  const sec = pset.sec;
  const skEl = $("#gen-skill"), rtEl = $("#gen-rtype");
  const skill = sec === "R" ? null : (skEl && SK[skEl.value] ? skEl.value : genSkillDefault(sec));
  if (rtEl) gen.rtype = rtEl.value;
  gen.busy = true; gen.ctl = new AbortController();
  gen.msg = sec === "R" ? "Writing a passage and questions. This usually takes under a minute." : "Writing questions. This usually takes 20 to 60 seconds.";
  render();
  try {
    const prompt = sec === "R" ? genPromptR(gen.rtype) : sec === "E" ? genPromptE(SK[skill]) : genPromptM(SK[skill]);
    const res = await sampleFn(prompt, { modelTier: "default", cache: false, signal: gen.ctl.signal });
    const data = parseJSON(res.text);
    const ids = sec === "R" ? storeAIPassage(data) : storeAIQuestions(data, sec, skill);
    if (!ids.length) throw { code: "invalid_json" };
    gen.busy = false; gen.msg = ""; gen.ctl = null; save();
    startSession({ sec: sec, qids: ids, timed: false, mode: "ai" });
  } catch (e) {
    gen.busy = false; gen.ctl = null; gen.msg = e && e.code === "cancelled" ? "" : aiErr(e);
    if (tab === "practice" && !sess) render();
  }
}
function explainPrompt(q, ch, pos) {
  const L = LETTERS[pos % 2], sec = SECTIONS[q.s].name, p = q.psg ? getP(q.psg) : null;
  return "You are a patient ACT " + sec + " tutor. A student wants this practice question explained a different way." +
    (p ? "\n\nPassage (paragraphs numbered):\n" + p.text.map((t, i) => "[" + (i + 1) + "] " + t).join("\n") : "") +
    "\n\nQuestion: " + plain(q.q) + (q.p ? "\n" + plain(q.p) : "") + "\nChoices:\n" + q.c.map((c, i) => L[i] + ") " + plain(c)).join("\n") +
    "\nCorrect answer: " + L[q.a] + "\n" + (ch == null ? "The student left it blank." : ch === q.a ? "The student chose " + L[ch] + ", which is correct, but wants to understand it better." : "The student chose " + L[ch] + ".") +
    "\nCurrent explanation: " + plain(whyText(q, pos)) +
    "\n\nExplain it differently in under 130 words. Start with the core rule or idea in one plain sentence, then show why the correct choice works" + (ch != null && ch !== q.a ? ", and exactly why the student's choice is tempting but wrong" : "") + ". Add a quick memory trick if one helps. Plain text only, no headings, no markdown.";
}
async function aiExplain(id, pos) {
  if (!sampleFn || !sess) return;
  const q = getQ(id), r = sess.res[id];
  const st = sess.ai[id] = { busy: true, text: "", err: "", ctl: new AbortController() };
  render();
  try {
    const res = await sampleFn(explainPrompt(q, r ? r.ch : null, pos), { cache: false, signal: st.ctl.signal, onText: (u) => { st.text = u.text; const el = document.getElementById("ai-" + id); if (el) el.textContent = u.text; } });
    st.text = res.text;
  } catch (e) {
    if (e && e.text) st.text = e.text;
    if (!e || e.code !== "cancelled") st.err = aiErr(e);
  }
  st.busy = false; st.ctl = null;
  if (sess && tab === "practice") render();
}
const tutor = { turns: [], busy: false, ctl: null, err: "", draft: "" };
function tutorRules() {
  const b = bestScores(), t = S.targets;
  const weak = weakSkills().slice(0, 4).map((x) => x.s.name).join("; ") || "not enough practice data yet";
  return "You are a sharp, encouraging ACT tutor working with a high school student. Facts about the current (enhanced) ACT: English is 50 questions in 35 minutes; Math is 45 questions in 50 minutes with four answer choices; Reading is 36 questions in 40 minutes; Science is optional and is not part of the Composite. The Composite is the average of English, Math, and Reading, rounded.\n" +
    "Her best scores: English " + b.E + ", Math " + b.M + ", Reading " + b.R + " (composite " + composite(b.E, b.M, b.R) + ")" + (b.S ? ", Science " + b.S : "") + ". Goal: a 30 or higher composite, so English + Math + Reading must total at least 89. Her targets: English " + t.E + ", Math " + t.M + ", Reading " + t.R + ". Test date: " + fmtLong(S.testDate) + ". Weakest areas from practice: " + weak + ".\n" +
    "How to help: be concise, usually under 170 words. Teach the rule in one line, show one quick example, and name the common trap. If she asks to be quizzed, give one original ACT-style question at a time with four choices labeled A to D, wait for her answer, then explain. If she pastes a problem, walk her through the first step and let her try before giving the full answer. Plain text and short lists only, no tables or headings.";
}
function scrollChat() { const m = $(".msgs"); if (m && m.lastElementChild) m.lastElementChild.scrollIntoView({ block: "nearest" }); }
async function tutorSend(text) {
  text = String(text || "").trim();
  if (!text || !sampleFn || tutor.busy) return;
  tutor.err = ""; tutor.draft = "";
  tutor.turns.push({ role: "user", content: text });
  const pending = { role: "assistant", content: "", pending: true };
  tutor.turns.push(pending);
  tutor.busy = true; tutor.ctl = new AbortController();
  render(); scrollChat();
  const history = tutor.turns.filter((x) => !x.pending && x.content).slice(-16).map((x) => ({ role: x.role, content: x.content }));
  try {
    const res = await sampleFn([{ role: "user", content: tutorRules() }].concat(history), { cache: false, signal: tutor.ctl.signal, onText: (u) => { pending.content = u.text; const el = $("#pending-msg"); if (el) el.textContent = u.text; } });
    pending.content = res.text + (res.truncated ? "\n\n(Cut short. Ask for a smaller piece at a time.)" : "");
    pending.pending = false;
  } catch (e) {
    if (e && e.text) { pending.content = e.text; pending.pending = false; } else tutor.turns.splice(tutor.turns.indexOf(pending), 1);
    if (!e || e.code !== "cancelled") tutor.err = aiErr(e);
  }
  tutor.busy = false; tutor.ctl = null;
  if (tab === "tutor") { render(); scrollChat(); }
}
function viewTutor() {
  if (aiState !== "on") return '<div class="wrap"><h2>Tutor</h2><p class="lede">' + (aiState === "pending" ? "Connecting to Claude…" : "The tutor uses Claude, which isn’t available in this view. Everything else on this page works without it.") + "</p></div>";
  const starters = ["Quiz me on commas, one question at a time", "Semicolon or colon: how do I decide fast?", "How do I stop running short on time in Reading?", "Teach me the unit circle in five minutes", "Give me a 15-minute math warm-up for tonight"];
  const msgs = tutor.turns.map((x) => '<div class="msg ' + (x.role === "user" ? "me" : "ai") + '"' + (x.pending ? ' id="pending-msg" aria-live="polite"' : "") + ">" + esc(x.content || (x.pending ? "Thinking…" : "")) + "</div>").join("");
  return '<div class="wrap chat"><h2>Tutor</h2><p class="lede">Ask about any rule, problem, or strategy. The tutor knows your scores, targets, and weak spots. It runs on your Claude account.</p>' +
    (tutor.turns.length ? "" : '<div class="pills">' + starters.map((s) => '<button class="pill" data-a="tutor-starter" data-v="' + esc(s) + '">' + esc(s) + "</button>").join("") + "</div>") +
    '<div class="msgs">' + msgs + "</div>" + (tutor.err ? '<p class="notice">' + esc(tutor.err) + "</p>" : "") +
    '<div class="composer"><textarea id="tutor-in" rows="2" placeholder="Ask a question, or paste a problem you missed" aria-label="Message the tutor">' + esc(tutor.draft) + "</textarea>" + (tutor.busy ? '<button class="btn alt" data-a="tutor-stop">Stop</button>' : '<button class="btn" data-a="tutor-send">Send</button>') + "</div>" +
    (tutor.turns.length && !tutor.busy ? '<p style="margin-top:10px"><button class="linkbtn" data-a="tutor-clear">Start a new conversation</button></p>' : "") + "</div>";
}

/* ---------- render ---------- */
let tab = "home", toastT = 0;
function toast(msg) {
  let el = $("#toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2800);
}
function focusKey(k) { const el = document.querySelector('[data-fk="' + k + '"]'); if (el) el.focus({ preventScroll: k !== "fb" }); }
function renderHeader() {
  const d = daysBetween(today(), S.testDate);
  $("#countdown").textContent = d > 1 ? d + " days to test day" : d === 1 ? "Test day is tomorrow" : d === 0 ? "Test day is today. You’ve got this." : "Pick your next test date";
  $$(".tab").forEach((b) => { b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"); });
  const tt = $('.tab[data-tab="tutor"]'); if (tt) tt.hidden = aiState !== "on";
  const rv = $('.tab[data-tab="review"] .count'); if (rv) { const n = dueIds().length; rv.textContent = n; rv.hidden = !n; }
}
function go(t) { tab = t; window.scrollTo(0, 0); render(); }
function render() {
  const ae = document.activeElement, fk = ae && ae.dataset ? ae.dataset.fk : null;
  const ps = $(".psg"), psTop = ps ? ps.scrollTop : 0, psKey = ps ? ps.dataset.pid : null;
  renderHeader();
  let html;
  try {
    html = tab === "plan" ? viewPlan() : tab === "practice" ? (sess ? viewSession() : viewPracticeSetup()) : tab === "review" ? viewReview() : tab === "scores" ? viewScores() : tab === "playbook" ? viewPlaybook() : tab === "tutor" ? viewTutor() : viewHome();
  } catch (e) {
    console.error(e);
    html = '<div class="wrap"><p class="notice">Something went wrong drawing this page. Your progress is safe. Try another tab.</p></div>';
  }
  const v = $("#view"); v.innerHTML = html;
  if (tab === "home") introDone = true;
  const ps2 = $(".psg"); if (ps2 && psKey && ps2.dataset.pid === psKey) ps2.scrollTop = psTop;
  if (fk) { const el = v.querySelector('[data-fk="' + fk + '"]'); if (el) el.focus({ preventScroll: true }); }
  if (tab === "playbook" && pbFocus) { const el = document.getElementById("rule-" + pbFocus); if (el) el.scrollIntoView({ block: "center" }); pbFocus = null; }
  if (tab === "plan" && io) renderIO();
}

/* ---------- events ---------- */
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const a = el.dataset.a, d = el.dataset;
  if (a !== "reset") resetArm = false;
  if (a !== "score-del") delArm = null;
  switch (a) {
    case "tab": go(d.tab); break;
    case "target": { const b = bestScores(); if (+d.v < b[d.sec]) toast("Targets start at your best score."); S.targets[d.sec] = clamp(Math.max(+d.v, b[d.sec] || 1), 1, 36); save(); render(); break; }
    case "preset": { const b = bestScores(); S.targets = { E: Math.max(+d.e, b.E), M: Math.max(+d.m, b.M), R: Math.max(+d.r, b.R) }; save(); render(); break; }
    case "toggle-task": if (S.done[d.id]) delete S.done[d.id]; else { S.done[d.id] = today(); markActive(); } save(); render(); break;
    case "task-act": { let o = null; try { o = JSON.parse(d.act); } catch (e) { /* ignore */ } if (o) runAct(o); break; }
    case "pset-sec": pset.sec = d.v; gen.msg = ""; render(); break;
    case "pset-n": pset.n = +d.v; render(); break;
    case "pset-timed": pset.timed = d.v === "1"; render(); break;
    case "pset-go": pset.sec = d.sec || "E"; sess = null; pacer = null; go("practice"); break;
    case "drill": startSession({ sec: d.sec, skill: d.skill || null, n: pset.n, timed: pset.timed, mode: "drill" }); break;
    case "psg": startSession({ sec: "R", psg: d.psg, timed: d.timed === "1", mode: "psg" }); break;
    case "choose": choose(+d.v); break;
    case "check": check(); break;
    case "next": next(); break;
    case "prev": prev(); break;
    case "jump": jump(+d.v); break;
    case "flag": { const id = sess.qids[sess.i]; sess.flag[id] = !sess.flag[id]; render(); break; }
    case "end": finishSession(false); break;
    case "psg-toggle": sess.psgOpen = !sess.psgOpen; render(); break;
    case "reason": setReason(d.id, d.v); break;
    case "again": again(); break;
    case "leave": sess = null; render(); break;
    case "review-now": startReview(); break;
    case "pacer": pacerOpen(d.sec); break;
    case "pacer-start": if (pacerElapsed() >= SECTIONS[pacer.sec].min * 60) pacer.acc = 0; pacer.t0 = Date.now(); pacer.running = true; startTick(); render(); break;
    case "pacer-pause": pacer.acc += Date.now() - pacer.t0; pacer.running = false; stopTick(); render(); break;
    case "pacer-reset": pacer.acc = 0; pacer.running = false; stopTick(); render(); break;
    case "pacer-close": pacer = null; stopTick(); render(); break;
    case "ai-gen": aiGenerate(); break;
    case "ai-stop": if (gen.ctl) gen.ctl.abort(); break;
    case "ai-explain": aiExplain(d.id, +d.pos); break;
    case "ai-explain-stop": { const s = sess && sess.ai[d.id]; if (s && s.ctl) s.ctl.abort(); break; }
    case "ext-add": addExt(); break;
    case "ext-del": delExt(d.id); break;
    case "score-add": addScore(); break;
    case "score-del": delScore(d.id); break;
    case "pb": pbTab = d.v; render(); break;
    case "td-check": S.check[d.id] = !S.check[d.id]; save(); render(); break;
    case "tutor-send": { const ta = $("#tutor-in"); tutorSend(ta ? ta.value : ""); break; }
    case "tutor-starter": tutorSend(d.v); break;
    case "tutor-stop": if (tutor.ctl) tutor.ctl.abort(); break;
    case "tutor-clear": tutor.turns = []; tutor.err = ""; render(); break;
    case "restart-plan": S.planStart = today(); save(); render(); toast("Plan restarted from today. Finished tasks stay checked."); break;
    case "save-name": S.name = String(($("#nm") || {}).value || "").trim().slice(0, 30); save(); render(); toast("Saved"); break;
    case "theme": S.theme = d.v; applyTheme(); save(); render(); break;
    case "backup": io = "backup"; renderIO(); break;
    case "summary": io = "summary"; renderIO(); break;
    case "show-restore": io = "restore"; renderIO(); break;
    case "copy-io": { const ta = $("#io-text"); if (ta) copyText(ta.value, ta); break; }
    case "do-restore": doRestore(); break;
    case "reset":
      if (!resetArm) { resetArm = true; render(); }
      else { resetArm = false; S = defaults(); flush(); applyTheme(); sess = null; pacer = null; io = null; tutor.turns = []; go("home"); toast("Everything was reset."); }
      break;
  }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.id === "test-date") { if (el.value === "custom") { customDate = true; render(); } else { customDate = false; S.testDate = el.value; save(); render(); } }
  else if (el.id === "custom-date") { if (el.value && el.value > today()) { S.testDate = el.value; save(); render(); } }
  else if (el.id === "hours") { S.hours = +el.value; pset.n = drillSize(); save(); render(); }
  else if (el.id === "ext-sec") { extSec = el.value; render(); }
  else if (el.id === "gen-rtype") gen.rtype = el.value;
});
document.addEventListener("input", (ev) => { if (ev.target.id === "tutor-in") tutor.draft = ev.target.value; });
document.addEventListener("toggle", (ev) => {
  const el = ev.target; if (!el || !el.dataset || !el.dataset.ok) return;
  const k = el.dataset.ok; if (el.open) { openSet.add(k); closedSet.delete(k); } else { openSet.delete(k); closedSet.add(k); }
}, true);
document.addEventListener("keydown", (ev) => {
  const t = ev.target;
  if (t && t.id === "tutor-in" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); tutorSend(t.value); return; }
  if (tab !== "practice" || !sess || sess.done) return;
  if (t && t.matches && t.matches("input, textarea, select")) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const L = LETTERS[sess.i % 2], k = (ev.key || "").toUpperCase();
  let idx = ["1", "2", "3", "4"].indexOf(k); if (idx < 0) idx = L.indexOf(k);
  if (idx >= 0) { ev.preventDefault(); choose(idx); return; }
  if (ev.key === "Enter" && !(t && (t.tagName === "BUTTON" || t.tagName === "A"))) {
    ev.preventDefault();
    const id = sess.qids[sess.i];
    if (sess.timed || sess.res[id]) next(); else if (sess.sel[id] != null) check();
  }
});

/* ---------- start ---------- */
applyTheme();
(function () { const b = bestScores(); SECS.forEach((k) => { if (S.targets[k] < b[k]) S.targets[k] = b[k]; }); })();
pset.n = drillSize();
render();
initAI();
})();

</script>
