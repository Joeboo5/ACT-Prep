<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road to 30: ACT study tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
/* ===== Road to 30: answer-sheet visual system ===== */
:root {
  --paper: #F5F7F2;
  --sheet: #FFFFFF;
  --rule: #C9DED6;
  --rule-strong: #7DB0A1;
  --ink: #2C7A68;
  --ink-tint: #E2EFEA;
  --graphite: #2B2E33;
  --graphite-2: #4E545B;
  --muted: #646B72;
  --pencil: #F2BF2E;
  --pencil-tint: #FCF0C8;
  --pencil-ink: #7A5800;
  --eraser: #E98AA2;
  --eraser-tint: #FBE6EC;
  --eraser-ink: #A8385C;
  --blue: #3B5BA5;
  --font-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: "Big Shoulders Display", "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --radius: 6px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1B1F22; --sheet: #22282B; --rule: #344944; --rule-strong: #4F7E71;
    --ink: #74C8B2; --ink-tint: #1F3631; --graphite: #E6EAE4; --graphite-2: #C3CAC4; --muted: #9DA59F;
    --pencil: #F2C14E; --pencil-tint: #3A3219; --pencil-ink: #F2C14E;
    --eraser: #F09AB0; --eraser-tint: #3D232A; --eraser-ink: #F4A9BC; --blue: #94AEEA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1B1F22; --sheet: #22282B; --rule: #344944; --rule-strong: #4F7E71;
  --ink: #74C8B2; --ink-tint: #1F3631; --graphite: #E6EAE4; --graphite-2: #C3CAC4; --muted: #9DA59F;
  --pencil: #F2C14E; --pencil-tint: #3A3219; --pencil-ink: #F2C14E;
  --eraser: #F09AB0; --eraser-tint: #3D232A; --eraser-ink: #F4A9BC; --blue: #94AEEA;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--graphite); font: 17px/1.55 var(--font-ui); min-height: 100%; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
p { margin: 0 0 12px; }
h1, h2, h3 { margin: 0; line-height: 1.15; }
h2 { font: 800 30px/1.1 var(--font-num); letter-spacing: .01em; margin-bottom: 6px; }
h3 { font: 700 19px/1.3 var(--font-ui); margin-bottom: 6px; }
.lede { color: var(--graphite-2); max-width: 64ch; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-top: 12px; }
.brand { font: 800 28px/1 var(--font-num); letter-spacing: .01em; display: flex; align-items: center; gap: 10px; }
.brand-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--graphite); box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--pencil); flex: none; transform: translateY(-1px); }
.countdown { font-size: 15px; color: var(--graphite-2); white-space: nowrap; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 10px 12px 12px; font-weight: 700; font-size: 16px; color: var(--graphite-2); cursor: pointer; position: relative; display: flex; align-items: center; gap: 7px; }
.tab::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--rule-strong); }
.tab[aria-current="page"] { color: var(--graphite); }
.tab[aria-current="page"]::before { background: var(--graphite); border-color: var(--graphite); }
.tab:hover { color: var(--graphite); }
.tab .count { font: 700 13px var(--font-ui); background: var(--eraser-tint); color: var(--eraser-ink); border-radius: 999px; padding: 0 7px; }

main { padding: 28px 0 64px; }
.notice { border-left: 4px solid var(--pencil); background: var(--pencil-tint); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; margin: 0 0 18px; font-size: 15px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 16px; line-height: 1.2; padding: 10px 16px; min-height: 44px; border-radius: var(--radius); border: 1.5px solid var(--graphite); background: var(--graphite); color: var(--paper); cursor: pointer; text-decoration: none; }
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.alt { background: transparent; color: var(--graphite); }
.btn.alt:hover { background: var(--ink-tint); filter: none; }
.btn.slim { min-height: 36px; padding: 6px 12px; font-size: 15px; }
.btn.hi { background: var(--pencil); border-color: var(--pencil); color: #2B2E33; }
.linkbtn { border: 0; background: none; padding: 4px 0; color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1.5px solid var(--rule-strong); background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 15px; cursor: pointer; color: var(--graphite-2); min-height: 38px; }
.pill[aria-pressed="true"] { background: var(--graphite); border-color: var(--graphite); color: var(--paper); }

/* ---------- bubbles ---------- */
.bub { width: 32px; height: 32px; flex: none; border-radius: 50%; border: 1.5px solid var(--rule-strong); background: transparent; display: inline-grid; place-items: center; font: 700 15px/1 var(--font-num); color: var(--ink); padding: 0; cursor: pointer; transition: background .15s, color .15s, box-shadow .15s; }
.bub:hover { border-color: var(--graphite); }

/* ---------- home: ladder hero ---------- */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 40px; align-items: start; }
.ladder { display: flex; gap: 22px; padding: 4px 2px; }
.lcol { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.lcol-head { font: 800 18px/1 var(--font-num); letter-spacing: .02em; margin-bottom: 6px; text-align: center; }
.lcol-head small { display: block; font: 400 13px var(--font-ui); color: var(--muted); margin-top: 3px; }
.lcol .bub { width: 34px; height: 34px; }
.bub.is-below { background: var(--ink-tint); border-color: var(--ink-tint); color: var(--ink); }
.bub.is-climb { background: var(--pencil-tint); border-color: var(--pencil); color: var(--pencil-ink); }
.bub.is-best { background: var(--graphite); border-color: var(--graphite); color: var(--paper); }
.bub.is-target { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--pencil); color: var(--graphite); font-weight: 800; }
.bub.is-best.is-target { color: var(--paper); }
@media (prefers-reduced-motion: no-preference) {
  .ladder.intro .bub.is-best { animation: pencil-in .7s cubic-bezier(.2,.8,.2,1) both; }
  .ladder.intro .lcol:nth-child(2) .bub.is-best { animation-delay: .12s; }
  .ladder.intro .lcol:nth-child(3) .bub.is-best { animation-delay: .24s; }
  @keyframes pencil-in { from { background: transparent; color: var(--ink); transform: scale(.7); } 60% { transform: scale(1.08); } to { transform: scale(1); } }
}
.key { display: flex; gap: 16px; font-size: 14px; color: var(--muted); margin-top: 12px; flex-wrap: wrap; }
.key i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.key .k-best { background: var(--graphite); }
.key .k-target { border: 2px solid var(--pencil); }
.key .k-climb { background: var(--pencil-tint); border: 1px solid var(--pencil); }

.readout .hello { font-size: 17px; color: var(--graphite-2); margin-bottom: 10px; max-width: 46ch; }
.scorepair { display: flex; align-items: flex-end; gap: 18px; margin: 4px 0 14px; }
.scorepair .big { font: 800 112px/0.86 var(--font-num); display: block; }
.scorepair .big.goal { color: var(--graphite); text-decoration: underline; text-decoration-color: var(--pencil); text-decoration-thickness: 10px; text-underline-offset: 10px; }
.scorepair .cap { font-size: 14px; color: var(--muted); display: block; margin-top: 12px; }
.scorepair .to { font: 700 28px var(--font-num); color: var(--muted); padding-bottom: 34px; }
.math-line { font-size: 15px; color: var(--graphite-2); margin: 0 0 4px; font-variant-numeric: tabular-nums; }
.math-line b { color: var(--graphite); }
.verdict { margin: 12px 0 14px; font-weight: 700; max-width: 52ch; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.sci { font-size: 15px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 10px; max-width: 56ch; }

.track { margin-top: 34px; margin-bottom: 6px; }
.track-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.track-head h3 { margin: 0; }
.marks { display: flex; flex-wrap: wrap; gap: 3px; }
.tm { width: 7px; height: 20px; border-radius: 1px; background: var(--rule); }
.tm.done { background: var(--graphite); }
.tm.today { background: var(--pencil); }
.tm.test { background: var(--eraser-ink); width: 10px; }
.tm.future { background: transparent; box-shadow: inset 0 0 0 1px var(--rule); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 36px; margin-top: 30px; }
.block { border-top: 2px solid var(--graphite); padding-top: 14px; }
.block > h3 { font: 800 22px/1.1 var(--font-num); letter-spacing: .01em; margin-bottom: 12px; }

.tasks { list-style: none; margin: 0; padding: 0; }
.task { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.task:last-child { border-bottom: 0; }
.task .bub { width: 26px; height: 26px; margin-top: 1px; font-size: 14px; }
.task.is-done .bub { background: var(--graphite); border-color: var(--graphite); color: var(--paper); }
.task.is-done .t-label { text-decoration: line-through; text-decoration-color: var(--rule-strong); color: var(--muted); }
.t-label { font-weight: 700; }
.t-sub { font-size: 15px; color: var(--muted); margin-top: 2px; }
.t-tag { display: inline-block; font: 800 13px/1 var(--font-num); letter-spacing: .02em; padding: 3px 6px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; background: var(--ink-tint); color: var(--ink); }
.t-tag.M { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
.t-tag.R { background: var(--eraser-tint); color: var(--eraser-ink); }
.t-tag.X { background: var(--pencil-tint); color: var(--pencil-ink); }

.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.stat .n { font: 800 44px/1 var(--font-num); display: block; }
.stat .l { font-size: 14px; color: var(--muted); }
.reg { margin-top: 18px; font-size: 15px; border-left: 4px solid var(--ink); padding: 8px 12px; background: var(--ink-tint); border-radius: 0 var(--radius) var(--radius) 0; }

/* ---------- plan ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; margin: 18px 0 26px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .field .lab { font-size: 14px; color: var(--muted); font-weight: 700; }
select, input[type="text"], input[type="number"], input[type="date"], textarea { background: var(--sheet); border: 1.5px solid var(--rule-strong); border-radius: var(--radius); padding: 8px 10px; min-height: 42px; }
textarea { width: 100%; min-height: 90px; font-size: 14px; }
input[type="number"] { width: 84px; }
.week { border-top: 1px solid var(--rule); }
.week > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 0; }
.week > summary::-webkit-details-marker { display: none; }
.wk-n { font: 800 34px/1 var(--font-num); }
.wk-title { font-weight: 700; }
.wk-dates { font-size: 14px; color: var(--muted); }
.wk-prog { font: 700 15px var(--font-num); color: var(--muted); white-space: nowrap; }
.week.is-now > summary .wk-n { color: var(--graphite); text-decoration: underline; text-decoration-color: var(--pencil); text-decoration-thickness: 5px; text-underline-offset: 5px; }
.week .tasks { padding: 0 0 14px 76px; }
.settings { margin-top: 44px; }
.settings .row { margin-bottom: 12px; }

/* ---------- practice setup ---------- */
.sec-pills { margin: 16px 0 22px; }
.skill-list { list-style: none; margin: 0 0 24px; padding: 0; border-top: 1px solid var(--rule); }
.skill-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.skill-row .s-name { font-weight: 700; }
.skill-row .s-meta { font-size: 14px; color: var(--muted); }
.meter { height: 8px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--ink); border-radius: 999px; }
.meter.lo > i { background: var(--eraser-ink); }
.meter.mid > i { background: var(--pencil); }
.opts { display: flex; flex-wrap: wrap; gap: 18px 28px; margin: 4px 0 22px; align-items: end; }
.psg-list { list-style: none; padding: 0; margin: 0 0 22px; border-top: 1px solid var(--rule); }
.psg-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.side-tools { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; margin-top: 30px; }
.ai-badge { display: inline-block; font: 700 12px/1 var(--font-ui); padding: 3px 7px; border-radius: 999px; background: var(--pencil-tint); color: var(--pencil-ink); vertical-align: 2px; margin-left: 6px; }

/* ---------- session ---------- */
.sess-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.qdots { display: flex; flex-wrap: wrap; gap: 5px; }
.qdot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--rule-strong); padding: 0; background: transparent; cursor: pointer; }
.qdot.ans { background: var(--graphite); border-color: var(--graphite); }
.qdot.ok { background: var(--ink); border-color: var(--ink); }
.qdot.no { background: var(--eraser-ink); border-color: var(--eraser-ink); }
.qdot.cur { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--pencil); }
.qdot.flag { border-color: var(--pencil); border-width: 3px; }
.clock { font: 800 34px/1 var(--font-num); font-variant-numeric: tabular-nums; }
.clock.warn { color: var(--eraser-ink); }
.clock-sub { font-size: 13px; color: var(--muted); display: block; text-align: right; }
.sess { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.sess.has-psg { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
.psg { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px 20px 8px; max-height: 72vh; overflow: auto; position: sticky; top: 120px; }
.psg h3 { font: 800 22px/1.1 var(--font-num); }
.psg .ptype { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.psg p { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px; line-height: 1.7; margin-bottom: 14px; }
.psg p .pn { font: 700 14px/1.9 var(--font-num); color: var(--ink); }
.psg-toggle { display: none; }
.qhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.qnum { font: 800 26px/1 var(--font-num); }
.qskill { font-size: 14px; color: var(--muted); }
.stem { font-size: 19px; line-height: 1.65; margin-bottom: 14px; max-width: 70ch; }
.stem u { text-decoration-thickness: 2px; text-underline-offset: 4px; }
.prompt { font-weight: 700; margin: 0 0 14px; max-width: 70ch; }
.slot { font: 700 15px var(--font-num); color: var(--ink); background: var(--ink-tint); padding: 1px 6px; border-radius: 3px; }
.choices { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; max-width: 70ch; }
.choice { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; width: 100%; padding: 9px 10px; border-radius: var(--radius); border: 1.5px solid transparent; background: transparent; cursor: pointer; line-height: 1.5; font-size: 17px; }
.choice .bub { pointer-events: none; }
.choice:hover:not(:disabled) { background: var(--ink-tint); }
.choice[aria-pressed="true"] .bub { background: var(--graphite); border-color: var(--graphite); color: var(--paper); }
.choice[aria-pressed="true"] { border-color: var(--rule-strong); }
.choice.is-right { border-color: var(--ink); background: var(--ink-tint); }
.choice.is-right .bub { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.choice.is-wrong { border-color: var(--eraser-ink); background: var(--eraser-tint); }
.choice.is-wrong .bub { background: var(--eraser-ink); border-color: var(--eraser-ink); color: var(--paper); }
.choice:disabled { cursor: default; color: inherit; }
.choice .ctext { padding-top: 4px; }
.fb { border-top: 2px solid var(--graphite); padding-top: 14px; margin-top: 4px; max-width: 70ch; }
.fb .verdict-ok, .fb .verdict-no { font: 800 24px/1.1 var(--font-num); margin-bottom: 8px; }
.fb .verdict-ok { color: var(--ink); }
.fb .verdict-no { color: var(--eraser-ink); }
.fb .why { margin-bottom: 12px; }
.fb .rule { font-size: 15px; color: var(--graphite-2); border-left: 4px solid var(--ink); padding: 4px 0 4px 12px; margin-bottom: 14px; }
.reasons { margin: 6px 0 14px; }
.reasons .lab { font-size: 14px; color: var(--muted); font-weight: 700; display: block; margin-bottom: 6px; }
.ai-out { white-space: pre-wrap; background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--pencil); border-radius: 0 var(--radius) var(--radius) 0; padding: 12px 14px; margin: 10px 0 14px; font-size: 16px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.kbd-hint { font-size: 13px; color: var(--muted); margin-top: 14px; }

/* math bits */
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .86em; line-height: 1.1; margin: 0 2px; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px 1px; }
.fr > span:last-child { padding: 1px 3px 0; }
.mx { display: inline-grid; grid-template-columns: auto auto; gap: 2px 14px; padding: 3px 8px; border-left: 2px solid currentColor; border-right: 2px solid currentColor; border-radius: 4px; vertical-align: middle; font-variant-numeric: tabular-nums; }
sup, sub { line-height: 0; }

/* results */
.res-head { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; }
.res-score { font: 800 96px/0.86 var(--font-num); }
.res-list { list-style: none; padding: 0; margin: 18px 0; border-top: 1px solid var(--rule); }
.res-item { border-bottom: 1px solid var(--rule); }
.res-item > summary { cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; align-items: start; list-style: none; }
.res-item > summary::-webkit-details-marker { display: none; }
.res-item .mark { font: 800 18px/1.4 var(--font-num); }
.res-item .mark.ok { color: var(--ink); }
.res-item .mark.no { color: var(--eraser-ink); }
.res-body { padding: 0 0 14px 40px; font-size: 16px; }

/* pacing timer */
.pacer { text-align: left; }
.pacer .clock { font-size: 120px; line-height: .9; }
.pacer .onq { font: 800 40px/1.1 var(--font-num); margin: 12px 0 4px; }
.checks { list-style: none; padding: 0; margin: 16px 0; display: flex; flex-wrap: wrap; gap: 8px; }
.checks li { border: 1.5px solid var(--rule-strong); border-radius: 999px; padding: 4px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.checks li.past { background: var(--graphite); color: var(--paper); border-color: var(--graphite); }

/* review */
.due-big { font: 800 96px/0.86 var(--font-num); }
.skillmap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin-top: 10px; }

.super .cell .n { font: 800 64px/0.9 var(--font-num); display: block; }

.chart svg { display: block; min-width: 560px; width: 100%; height: auto; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--graphite-2); }

table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; min-width: 560px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--rule); font-size: 15px; }

.fgroup { margin-bottom: 26px; }
.fgroup h3 { font: 800 22px/1.1 var(--font-num); }

<script>
